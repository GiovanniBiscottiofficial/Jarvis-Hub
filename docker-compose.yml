# Jarvis Hub — core stack
# Usage: docker compose up -d
# Optional profiles:
#   docker compose --profile voice up -d     (Whisper/Piper/openWakeWord)
#   docker compose --profile grocy up -d     (fridge/pantry inventory)
#   docker compose --profile llm up -d       (local Ollama LLM)
#   docker compose --profile cameras up -d   (Frigate NVR — needs cameras + frigate/config.yml)
#   docker compose --profile media up -d     (Plex media server)
#   docker compose --profile jellyfin up -d  (Jellyfin — free/open-source alternative to Plex)
#   docker compose --profile gestures up -d --build  (hand-gesture kiosk control via the webcam)

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./ha-config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /run/udev:/run/udev:ro

  # ---------- LifeOS: Vault Flow + Body Ops ----------
  lifeos:
    container_name: lifeos
    build: ./lifeos
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/New_York}
      # Weather in the morning briefing (Open-Meteo, no API key)
      - LIFEOS_LAT=${LIFEOS_LAT:-}
      - LIFEOS_LON=${LIFEOS_LON:-}
      # Home-to-work briefing route. A commissioned HA commute sensor wins;
      # otherwise LifeOS labels the keyless OSRM estimate as baseline-only.
      - LIFEOS_WORK_ADDRESS=${LIFEOS_WORK_ADDRESS:-4411 W. Market St, Greensboro, NC 27405}
      - LIFEOS_WORK_LAT=${LIFEOS_WORK_LAT:-}
      - LIFEOS_WORK_LON=${LIFEOS_WORK_LON:-}
      - LIFEOS_COMMUTE_ENTITY=${LIFEOS_COMMUTE_ENTITY:-}
      # Grocy pantry sync (Grocy → Settings → Manage API keys)
      - GROCY_URL=${GROCY_URL:-}
      - GROCY_API_KEY=${GROCY_API_KEY:-}
      - LIFEOS_API_TOKEN=${LIFEOS_API_TOKEN:-}
      - LIFEOS_HEALTH_WEBHOOK_SECRET=${LIFEOS_HEALTH_WEBHOOK_SECRET:-}
      - OLLAMA_URL=http://ollama:11434
      - LIFEOS_VISION_MODEL=${LIFEOS_VISION_MODEL:-gemma3:4b}
      - LIFEOS_MAX_PHOTO_BYTES=${LIFEOS_MAX_PHOTO_BYTES:-8388608}
      - LIFEOS_VISION_EVENT_RETENTION_HOURS=${LIFEOS_VISION_EVENT_RETENTION_HOURS:-24}
      # Optional: enables policy-controlled actions after proposals are reviewed.
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL:-http://host.docker.internal:8123}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    volumes:
      - lifeos-data:/data

  # ---------- Voice pipeline (profile: voice) ----------
  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper
    profiles: [voice]
    restart: unless-stopped
    command: --model base-int8 --language en
    ports:
      - "10300:10300"
    volumes:
      - whisper-data:/data

  piper:
    container_name: piper
    image: rhasspy/wyoming-piper
    profiles: [voice]
    restart: unless-stopped
    # Calm, local Jarvis voice. Every setting remains overridable in .env.
    # A small sentence pause and restrained noise produce clearer briefings on
    # the X1 speakers without making short confirmations feel sluggish.
    command:
      - --voice
      - ${PIPER_VOICE:-en_GB-alan-medium}
      - --length-scale
      - ${PIPER_LENGTH_SCALE:-1.03}
      - --noise-scale
      - ${PIPER_NOISE_SCALE:-0.45}
      - --noise-w-scale
      - ${PIPER_NOISE_W_SCALE:-0.70}
      - --sentence-silence
      - ${PIPER_SENTENCE_SILENCE:-0.18}
    ports:
      - "10200:10200"
    volumes:
      - piper-data:/data

  openwakeword:
    container_name: openwakeword
    image: rhasspy/wyoming-openwakeword
    profiles: [voice]
    restart: unless-stopped
    # Two consecutive high-confidence frames prevent television dialogue from
    # waking the room microphone while preserving a deliberate "Hey Jarvis".
    command:
      - --preload-model
      - hey_jarvis
      - --threshold
      - ${WAKE_WORD_THRESHOLD:-0.70}
      - --trigger-level
      - ${WAKE_WORD_TRIGGER_LEVEL:-2}
      - --refractory-seconds
      - ${WAKE_WORD_REFRACTORY_SECONDS:-5}
    ports:
      - "10400:10400"
    volumes:
      - openwakeword-data:/data

  # ---------- Continuous local conversation (profile: conversation) ----------
  # Successor to the archived Wyoming Satellite runtime. It exposes an ESPHome
  # Assist satellite with continued conversations, local Hey Jarvis/Stop words,
  # timers, and announcements. bootstrap/setup-continuous-voice.sh performs the
  # guarded migration and restores Wyoming automatically if this fails health.
  voice-permissions:
    image: ghcr.io/ohf-voice/linux-voice-assistant:1.1.15
    profiles: [conversation]
    entrypoint: []
    command: >-
      chown -R ${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000}
      /app/local /app/configuration /app/wakewords/custom /app/sounds/custom
    volumes:
      - lva-local:/app/local
      - lva-configuration:/app/configuration
      - lva-wakewords:/app/wakewords/custom
      - lva-sounds:/app/sounds/custom
    restart: "no"

  linux-voice-assistant:
    container_name: linux-voice-assistant
    image: ghcr.io/ohf-voice/linux-voice-assistant:1.1.15
    profiles: [conversation]
    restart: unless-stopped
    network_mode: host
    user: "${LVA_USER_ID:-1000}:${LVA_USER_GROUP:-1000}"
    group_add:
      - audio
    cap_add:
      - SYS_NICE
    environment:
      - XDG_RUNTIME_DIR=${LVA_RUNTIME_DIR:-/run/user/1000}
      - PULSE_SERVER=${LVA_PULSE_SERVER:-/run/user/1000/pulse/native}
      - PULSE_COOKIE=${LVA_PULSE_COOKIE:-/run/user/1000/pulse/cookie}
      - CLIENT_NAME=${LVA_CLIENT_NAME:-Jarvis X1}
      - HOST=0.0.0.0
      - PORT=${LVA_PORT:-6053}
      - AUDIO_INPUT_DEVICE=${LVA_AUDIO_INPUT_DEVICE:-Jabra SPEAK 510 USB Mono}
      - AUDIO_OUTPUT_DEVICE=${LVA_AUDIO_OUTPUT_DEVICE:-pipewire}
      - AUDIO_INPUT_CHANNELS=${LVA_AUDIO_INPUT_CHANNELS:-1}
      - WAKE_MODEL=${LVA_WAKE_MODEL:-hey_jarvis}
      - STOP_MODEL=${LVA_STOP_MODEL:-stop}
      - CONTINUE_CONVERSATION_DELAY=${LVA_CONTINUE_DELAY:-0.55}
      - MIC_AUTO_GAIN=${LVA_MIC_AUTO_GAIN:-0}
      - MIC_NOISE_SUPPRESSION=${LVA_MIC_NOISE_SUPPRESSION:-1}
      - ENABLE_THINKING_SOUND=${LVA_THINKING_SOUND:-1}
      - LISTEN_DURING_WAKE_SOUND=${LVA_LISTEN_DURING_WAKE_SOUND:-0}
    volumes:
      - lva-local:/app/local
      - lva-configuration:/app/configuration
      - lva-wakewords:/app/wakewords/custom
      - lva-sounds:/app/sounds/custom
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ${LVA_RUNTIME_DIR:-/run/user/1000}:${LVA_RUNTIME_DIR:-/run/user/1000}
    depends_on:
      voice-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-f", "linux_voice_assistant"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  # ---------- Fridge / pantry inventory (profile: grocy) ----------
  grocy:
    container_name: grocy
    image: lscr.io/linuxserver/grocy:latest
    profiles: [grocy]
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/New_York}
    ports:
      - "9283:80"
    volumes:
      - grocy-data:/config

  # ---------- Cameras / NVR (profile: cameras) ----------
  # Edit frigate/config.yml with your camera RTSP URLs first.
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    profiles: [cameras]
    restart: unless-stopped
    shm_size: "128mb"
    environment:
      - TZ=${TZ:-America/New_York}
    devices:
      - /dev/dri:/dev/dri   # Intel QuickSync hardware video decoding
    ports:
      - "5000:5000"     # web UI + API
      - "8554:8554"     # RTSP restream
    volumes:
      - ./frigate:/config
      - frigate-media:/media/frigate

  # ---------- Media server (profile: media) ----------
  # First run: grab a claim token from https://plex.tv/claim (valid 4 min),
  # put it in .env as PLEX_CLAIM, then: docker compose --profile media up -d
  # Put movies/shows/music under ~/jarvis-media (or change MEDIA_DIR in .env).
  # Then in HA: Settings → Devices & Services → Add Integration → Plex.
  plex:
    container_name: plex
    image: lscr.io/linuxserver/plex:latest
    profiles: [media]
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/New_York}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    devices:
      - /dev/dri:/dev/dri   # Intel QuickSync hardware transcoding
    volumes:
      - plex-config:/config
      - ${MEDIA_DIR:-${HOME}/jarvis-media}:/media

  # ---------- Media server, free alternative (profile: jellyfin) ----------
  # No account needed. After first start: http://<laptop-ip>:8096 to set up,
  # then HA → Settings → Devices & Services → Add Integration → Jellyfin.
  # Uses the same media folder as Plex — run one or the other (or both).
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    profiles: [jellyfin]
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ:-America/New_York}
    devices:
      - /dev/dri:/dev/dri   # Intel QuickSync hardware transcoding
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_DIR:-${HOME}/jarvis-media}:/media

  # ---------- Local LLM (profile: llm) ----------
  # X1 voice fallback: docker exec -it ollama ollama pull llama3.2:1b
  # Keep HA's fast local intents preferred; do not inject the full Assist tool
  # catalog into this small model unless running on substantially faster hardware.
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    profiles: [llm]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # ---------- Hand-gesture kiosk control (profile: gestures) ----------
  # Watches the go2rtc webcam stream (setup-satellite.sh) for swipes and
  # controls Chromium through its loopback DevTools channel. Containerized because
  # MediaPipe needs Python <=3.12.
  gestures:
    container_name: gestures
    build: ./gestures
    profiles: [gestures]
    restart: unless-stopped
    cpus: 1.0
    network_mode: host
    devices:
      - "${X1_CAMERA_DEVICE:-/dev/video4}:${X1_CAMERA_DEVICE:-/dev/video4}"
    environment:
      - GESTURE_SOURCE=${GESTURE_SOURCE:-/dev/video4}
      - GESTURE_DEVTOOLS_URL=http://127.0.0.1:9222
      - LIFEOS_URL=http://127.0.0.1:8090
      - LIFEOS_API_TOKEN=${LIFEOS_API_TOKEN:-}
      - GESTURE_STATUS_PATH=/run/jarvis/perception.json
      - GESTURE_PRESENCE_CLEAR_S=${GESTURE_PRESENCE_CLEAR_S:-8}
      - GESTURE_PRESENCE_HEARTBEAT_S=${GESTURE_PRESENCE_HEARTBEAT_S:-300}
      - GESTURE_MIN_SPEED=${GESTURE_MIN_SPEED:-0.18}
      - GESTURE_POSE_HOLD_S=${GESTURE_POSE_HOLD_S:-0.65}
      - GESTURE_MIN_PALM_SCALE=${GESTURE_MIN_PALM_SCALE:-0.040}
      - GESTURE_EDGE_MARGIN=${GESTURE_EDGE_MARGIN:-0.08}
      - GESTURE_TOP_MARGIN=${GESTURE_TOP_MARGIN:-0.22}
      - GESTURE_STABLE_HAND_FRAMES=${GESTURE_STABLE_HAND_FRAMES:-3}
      - GESTURE_SEEK_SECONDS=${GESTURE_SEEK_SECONDS:-10}
      - GESTURE_VOLUME_STEP=${GESTURE_VOLUME_STEP:-0.10}
      # Tuning: GESTURE_COOLDOWN_S, GESTURE_X_TRAVEL, GESTURE_Y_TRAVEL,
      # GESTURE_WINDOW_S, and GESTURE_STATUS_INTERVAL_S
    volumes:
      - /run/jarvis:/run/jarvis

volumes:
  plex-config:
  jellyfin-config:
  jellyfin-cache:
  lifeos-data:
  whisper-data:
  piper-data:
  openwakeword-data:
  lva-local:
  lva-configuration:
  lva-wakewords:
  lva-sounds:
  grocy-data:
  ollama-data:
  frigate-media:
