<!DOCTYPE html>
<!-- Jarvis boot splash — a live "initializing systems" screen.
     Served by Home Assistant at  /local/jarvis-splash.html
     Redirects to the dashboard when the boot sequence finishes:
       /local/jarvis-splash.html?next=/jarvis-hub/wall   (default)
     The kiosk (bootstrap/setup-kiosk.sh) boots into this page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS_HUB</title>
<style>
  :root {
    --cyan: #00d4ff;
    --cyan-dim: rgba(0, 212, 255, 0.35);
    --bg: #000810;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 45%, #001428 0%, var(--bg) 70%);
    color: var(--cyan);
    font-family: "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }

  /* moving circuit grid */
  .grid {
    position: fixed; inset: 0;
    background:
      linear-gradient(rgba(0, 212, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 212, 255, 0.07) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: moveGrid 3s linear infinite;
    mask-image: radial-gradient(circle at 50% 50%, transparent 30%, black 80%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 30%, black 80%);
  }
  @keyframes moveGrid {
    from { background-position: 0 0; }
    to { background-position: 50px 50px; }
  }

  /* corner brackets */
  .corner { position: fixed; width: 90px; height: 90px; border: 2px solid var(--cyan-dim); }
  .corner.tl { top: 24px; left: 24px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 24px; right: 24px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 24px; left: 24px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 24px; right: 24px; border-left: 0; border-top: 0; }

  .top-label {
    position: fixed; top: 40px;
    font-size: 13px; color: var(--cyan-dim);
    animation: flicker 4s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 0.9; } 92% { opacity: 0.9; }
    93% { opacity: 0.3; } 94% { opacity: 0.9; } 96% { opacity: 0.4; } 97% { opacity: 0.9; }
  }

  /* ================= reactor core ================= */
  .reactor { position: relative; width: min(46vmin, 420px); height: min(46vmin, 420px); }
  .reactor svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .spin-cw    { animation: spin 9s linear infinite; transform-origin: 50% 50%; }
  .spin-ccw   { animation: spin 6s linear infinite reverse; transform-origin: 50% 50%; }
  .spin-slow  { animation: spin 20s linear infinite; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .core {
    position: absolute; left: 50%; top: 50%;
    width: 18%; height: 18%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #eaffff 0%, var(--cyan) 40%, transparent 75%);
    box-shadow: 0 0 40px 12px var(--cyan-dim), 0 0 120px 30px rgba(0, 212, 255, 0.2);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.95; }
    50% { transform: translate(-50%, -50%) scale(1.18); opacity: 1; }
  }

  /* beams through the core */
  .beam-v, .beam-h {
    position: absolute; left: 50%; top: 50%;
    background: linear-gradient(to bottom, transparent, var(--cyan-dim), transparent);
    animation: beam 3s ease-in-out infinite;
  }
  .beam-v { width: 2px; height: 170%; transform: translate(-50%, -50%); }
  .beam-h { height: 2px; width: 170%; transform: translate(-50%, -50%);
    background: linear-gradient(to right, transparent, var(--cyan-dim), transparent); }
  @keyframes beam { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }

  /* ================= side systems ================= */
  .side { position: fixed; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 34px; font-size: 13px; }
  .side.left { left: 5vw; align-items: flex-start; }
  .side.right { right: 5vw; align-items: flex-end; }
  .sys { display: flex; align-items: center; gap: 12px; color: var(--cyan-dim);
    opacity: 0; animation: sysOn 0.5s forwards; }
  .side.right .sys { flex-direction: row-reverse; }
  .sys .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan); animation: blink 2.4s infinite; }
  .sys .tick { width: 46px; height: 1px; background: var(--cyan-dim); }
  .sys:nth-child(1) { animation-delay: 0.8s; } .sys:nth-child(1) .dot { animation-delay: 0.2s; }
  .sys:nth-child(2) { animation-delay: 1.5s; } .sys:nth-child(2) .dot { animation-delay: 0.9s; }
  .sys:nth-child(3) { animation-delay: 2.2s; } .sys:nth-child(3) .dot { animation-delay: 1.6s; }
  @keyframes sysOn { to { opacity: 1; } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* ================= title + boot log ================= */
  .title {
    margin-top: 6vmin;
    font-size: clamp(34px, 7vmin, 72px);
    font-weight: 200; color: #dfeef5;
    text-shadow: 0 0 18px rgba(0, 212, 255, 0.55), 0 0 60px rgba(0, 212, 255, 0.25);
  }
  .title span { color: var(--cyan); font-weight: 300; }

  .status { margin-top: 3vmin; font-size: 14px; color: var(--cyan-dim); min-height: 20px; }
  .status::after { content: "…"; animation: blink 1s infinite; }

  .bar-wrap { margin-top: 2.5vmin; width: min(46vmin, 420px); height: 2px;
    background: rgba(0, 212, 255, 0.15); position: relative; overflow: hidden; }
  .bar { position: absolute; inset: 0; width: 0%;
    background: linear-gradient(to right, transparent, var(--cyan));
    box-shadow: 0 0 12px var(--cyan); transition: width 0.45s ease; }

  /* fade-out before handing over to the dashboard */
  body.done { animation: fadeOut 0.9s ease forwards; }
  @keyframes fadeOut { to { opacity: 0; } }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="top-label">AI Core Online</div>

  <div class="side left">
    <div class="sys"><span class="dot"></span><span class="tick"></span>Smart Home</div>
    <div class="sys"><span class="dot"></span><span class="tick"></span>Automation</div>
    <div class="sys"><span class="dot"></span><span class="tick"></span>Security</div>
  </div>
  <div class="side right">
    <div class="sys"><span class="dot"></span><span class="tick"></span>Climate</div>
    <div class="sys"><span class="dot"></span><span class="tick"></span>Lighting</div>
    <div class="sys"><span class="dot"></span><span class="tick"></span>Entertainment</div>
  </div>

  <div class="reactor">
    <div class="beam-v"></div><div class="beam-h"></div>
    <svg viewBox="0 0 200 200">
      <g class="spin-slow" stroke="rgba(0,212,255,0.25)" fill="none">
        <circle cx="100" cy="100" r="96" stroke-dasharray="4 6"/>
      </g>
      <g class="spin-cw" fill="none" stroke-linecap="round">
        <circle cx="100" cy="100" r="80" stroke="rgba(0,212,255,0.2)" stroke-width="2"/>
        <path d="M 100 20 A 80 80 0 0 1 180 100" stroke="#7fe9ff" stroke-width="5"/>
        <path d="M 100 180 A 80 80 0 0 1 20 100" stroke="rgba(0,212,255,0.6)" stroke-width="3"/>
      </g>
      <g class="spin-ccw" fill="none" stroke-linecap="round">
        <circle cx="100" cy="100" r="62" stroke="rgba(0,212,255,0.18)" stroke-width="1.5"/>
        <path d="M 162 100 A 62 62 0 0 1 100 162" stroke="#00d4ff" stroke-width="4"/>
        <circle cx="100" cy="100" r="48" stroke="rgba(0,212,255,0.35)"
                stroke-width="8" stroke-dasharray="2 5"/>
      </g>
      <g class="spin-slow" fill="none" stroke="rgba(0,212,255,0.5)">
        <ellipse cx="100" cy="100" rx="36" ry="14"/>
        <ellipse cx="100" cy="100" rx="36" ry="14" transform="rotate(60 100 100)"/>
        <ellipse cx="100" cy="100" rx="36" ry="14" transform="rotate(120 100 100)"/>
      </g>
    </svg>
    <div class="core"></div>
  </div>

  <div class="title">JARVIS<span>_HUB</span></div>
  <div class="status" id="status">Initializing systems</div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>

<script>
  const steps = [
    "Initializing systems",
    "Loading smart home core",
    "Connecting voice pipeline",
    "Syncing LifeOS",
    "Calibrating sensors",
    "All systems online",
  ];
  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "/jarvis-hub/wall";
  const statusEl = document.getElementById("status");
  const bar = document.getElementById("bar");
  let i = 0;
  const tick = setInterval(() => {
    i += 1;
    if (i < steps.length) {
      statusEl.textContent = steps[i];
      bar.style.width = Math.round((i / (steps.length - 1)) * 100) + "%";
    } else {
      clearInterval(tick);
      document.body.classList.add("done");
      setTimeout(() => location.replace(next), 900);
    }
  }, 1400);
  bar.style.width = "8%";
</script>
</body>
</html>
