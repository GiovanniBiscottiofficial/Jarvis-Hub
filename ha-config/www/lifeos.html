<!DOCTYPE html>
<!-- LifeOS wrapper — embeds the LifeOS app (port 8090) full-screen using
     whatever hostname you reached HA on (localhost on the kiosk, LAN IP on
     your phone, Tailscale IP remotely), so the link works from anywhere.
     Served at  /local/lifeos.html  and used by the LifeOS sidebar panel. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeOS</title>
<style>
  html, body { height: 100%; margin: 0; background: #04070f; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="app" title="LifeOS" allow="camera; microphone"></iframe>
<script>
  'use strict';
  const app = document.getElementById('app');
  const appOrigin = location.protocol + '//' + location.hostname + ':8090';
  let retryTimer = null;
  let refreshPromise = null;

  function locateHass() {
    let context = window;
    for (let depth = 0; depth < 6; depth += 1) {
      try {
        const root = context.document.querySelector('home-assistant');
        if (root && root.hass) return root.hass;
        if (context === context.parent) break;
        context = context.parent;
      } catch (_) { break; }
    }
    return null;
  }

  async function currentAccessToken() {
    const hass = locateHass();
    if (!hass) return null;
    // Home Assistant exposes the websocket Auth object through connection
    // options in current releases.  Keep the direct path for older frontends.
    const candidates = [
      hass.auth,
      hass.connection && hass.connection.options && hass.connection.options.auth,
      hass.connection && hass.connection.auth,
    ].filter(Boolean);
    for (const auth of candidates) {
      if (auth.expired && typeof auth.refreshAccessToken === 'function') {
        if (!refreshPromise) {
          refreshPromise = Promise.resolve(auth.refreshAccessToken())
            .finally(() => { refreshPromise = null; });
        }
        await refreshPromise;
      }
      const token = (
        (auth.data && auth.data.access_token) ||
        auth.accessToken ||
        (auth.currentSession && auth.currentSession.access_token) ||
        (auth._token && auth._token.access_token)
      );
      if (token) return token;
    }
    return null;
  }

  async function sendHomeAssistantSession() {
    let token = null;
    try { token = await currentAccessToken(); } catch (_) { return false; }
    if (token) {
      app.contentWindow.postMessage({ type: 'lifeos-ha-auth', token }, appOrigin);
      if (retryTimer) {
        window.clearInterval(retryTimer);
        retryTimer = null;
      }
      return true;
    }
    return false;
  }

  // LifeOS may install its message listener after the iframe load event.  A
  // request/reply handshake makes the bridge reliable without persisting the
  // Home Assistant token in the URL or browser storage.
  window.addEventListener('message', (event) => {
    if (event.source !== app.contentWindow || event.origin !== appOrigin) return;
    if (!event.data || event.data.type !== 'lifeos-auth-request') return;
    sendHomeAssistantSession();
  });

  app.addEventListener('load', () => {
    sendHomeAssistantSession();
    if (retryTimer) window.clearInterval(retryTimer);
    retryTimer = window.setInterval(sendHomeAssistantSession, 500);
    window.setTimeout(() => {
      if (retryTimer) window.clearInterval(retryTimer);
      retryTimer = null;
    }, 10000);
  });
  app.src = appOrigin + '/?embedded=home-assistant';
</script>
</body>
</html>
