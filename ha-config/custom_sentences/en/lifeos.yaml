# Ask Jarvis about LifeOS by voice (Assist). Answers live in intents.yaml.
language: en
intents:
  LifeOSProtein:
    data:
      - sentences:
          - "how much protein [do I have] left [today]"
          - "how's my protein [today]"
          - "protein check"
          - "am I hitting my protein [target]"
  LifeOSSteps:
    data:
      - sentences:
          - "how many steps [do I have] [today]"
          - "how's my steps [today]"
          - "step check"
  LifeOSBills:
    data:
      - sentences:
          - "what bills are due [this week]"
          - "do I have [any] bills due [soon]"
          - "bill check"
  LifeOSMoney:
    data:
      - sentences:
          - "how much money do I have [left]"
          - "what's left after bills"
          - "money check"
          - "vault check"
  LifeOSMeals:
    data:
      - sentences:
          - "what can I eat"
          - "what can I make [for dinner]"
          - "what should I eat"
          - "meal ideas"
  LifeOSDinner:
    data:
      - sentences:
          - "what('s | is )for dinner [tonight]"
          - "what should I (make | eat) for dinner"
          - "dinner ideas"
  LifeOSBriefing:
    data:
      - sentences:
          - "brief me"
          - "[give me] [the] morning briefing"
          - "what's my day look [ing] like"
  LifeOSWeeklyReview:
    data:
      - sentences:
          - "how did I do this week"
          - "[give me] [the] weekly review"
          - "how was my week"
  LifeOSTakeVitamins:
    data:
      - sentences:
          - "I took my vitamins [today]"
          - "log [my] vitamins"
          - "vitamins done"
  LifeOSLogProtein:
    data:
      - sentences:
          - "log {grams} grams of protein"
          - "add {grams} grams of protein"
          - "I ate {grams} grams of protein"
  LifeOSWeighIn:
    data:
      - sentences:
          - "log a weigh in of {pounds} [pounds]"
          - "I weigh {pounds} [pounds]"
          - "log [my] weight [at] {pounds} [pounds]"
  LifeOSSetSteps:
    data:
      - sentences:
          - "log {steps} steps [today]"
          - "set [my] steps to {steps}"
  LifeOSWorkout:
    data:
      - sentences:
          - "I did my workout"
          - "I finished my workout"
          - "log a workout"
          - "I worked out"
          - "workout done"
  LifeOSTreat:
    data:
      - sentences:
          - "I'm having a treat [today]"
          - "log a treat"
          - "treat time"
  # Must come before LifeOSDeposit: "add 50 to my vacation fund" would
  # otherwise match the deposit wildcard with account="my vacation fund".
  LifeOSGoalContribute:
    data:
      - sentences:
          - "add {amount} [dollars] to my {goal} fund"
          - "put {amount} [dollars] in [my] {goal} fund"
          - "save {amount} [dollars] for {goal}"
  LifeOSDeposit:
    data:
      - sentences:
          - "log a deposit of {amount} [dollars] to {account}"
          - "add {amount} [dollars] to {account}"
          - "{account} got a deposit of {amount} [dollars]"
  LifeOSBillPaid:
    data:
      - sentences:
          - "mark {bill} [as] paid"
          - "I paid [the] {bill} [bill]"
          - "{bill} is paid"
  LifeOSAddBill:
    data:
      - sentences:
          - "add a bill called {bill} for {amount} [dollars] due [on] [the] {due_day}"
          - "add a bill {bill} for {amount} [dollars] due [on] [the] {due_day}"
          - "new bill {bill} {amount} [dollars] due [on] [the] {due_day}"
  LifeOSAddAccount:
    data:
      - sentences:
          - "add an account called {account}"
          - "create [an] account [called] {account}"
  LifeOSSpend:
    data:
      - sentences:
          - "I spent {amount} [dollars] at {merchant}"
          - "log spending of {amount} [dollars] at {merchant}"
      - sentences:
          - "I spent {amount} [dollars]"
          - "log spending of {amount} [dollars]"
        slots:
          merchant: ""
  LifeOSSpendCheck:
    data:
      - sentences:
          - "how much have I spent [this week]"
          - "spending check"
          - "what's my spending [this week]"
  LifeOSGroceryAdd:
    data:
      - sentences:
          - "add {item} to [the] grocery list"
          - "put {item} on [the] grocery list"
          - "we're out of {item}"
          - "we are out of {item}"
  LifeOSGroceryList:
    data:
      - sentences:
          - "what('s | is )on the grocery list"
          - "read [me] the grocery list"
          - "grocery [list] check"
  LifeOSGroceryRemove:
    data:
      - sentences:
          - "take {item} off [of] [the] grocery list"
          - "remove {item} from [the] grocery list"
          - "cross {item} off [the] grocery list"
  LifeOSGroceryClear:
    data:
      - sentences:
          - "clear the grocery list"
          - "empty the grocery list"
  LifeOSLogUsual:
    data:
      - sentences:
          - "log my usual {slot}"
          - "I had my usual {slot}"
  LifeOSSetUsual:
    data:
      - sentences:
          - "set my usual {slot} to {meal}"
          - "my usual {slot} is {meal}"
  LifeOSWater:
    data:
      - sentences:
          - "log {glasses} glasses of water"
          - "I drank {glasses} glasses of water"
      - sentences:
          - "log a glass of water"
          - "I drank a glass of water"
          - "water down"
        slots:
          glasses: 1
  LifeOSWaterCheck:
    data:
      - sentences:
          - "how much water have I had [today]"
          - "how's my water [today]"
          - "water check"
  LifeOSGoalsCheck:
    data:
      - sentences:
          - "how are my savings [goals]"
          - "savings check"
          - "how much have I saved"
  JarvisEveningReport:
    data:
      - sentences:
          - "[give me the] evening report"
          - "how did I do today"
          - "recap my day"
          - "end of day report"
  JarvisTimer:
    data:
      - sentences:
          - "set a timer for {minutes} minutes"
          - "[start a] timer for {minutes} minutes"
          - "start a {minutes} minute timer"
  JarvisCancelReminders:
    data:
      - sentences:
          - "cancel [all] [my] reminders"
          - "cancel [all] [my] timers"
          - "cancel the (reminder | timer)"
  JarvisHouseStatus:
    data:
      - sentences:
          - "is the house ready for the night"
          - "house status [report]"
          - "status report"
          - "how's the house [looking]"
  JarvisRemind:
    data:
      - sentences:
          - "remind me to {task} in {minutes} minutes"
          - "set a reminder to {task} in {minutes} minutes"
          - "in {minutes} minutes remind me to {task}"
  JarvisAnnounce:
    data:
      - sentences:
          - "announce {message}"
          - "tell everyone [that] {message}"
          - "tell the house [that] {message}"
  JarvisWakeUp:
    data:
      - sentences:
          - "wake up"
          - "come online"
          - "full system startup"
          - "initialize [all] systems"
          - "power up"
  JarvisMoodSupport:
    data:
      - sentences:
          - "I'm having a (bad | rough | terrible) day"
          - "I've had a (bad | rough | terrible) day"
          - "I'm (stressed | frustrated | overwhelmed) [out]"
          - "today (sucked | was awful)"
  JarvisQuietOn:
    data:
      - sentences:
          - "quiet mode on"
          - "[turn on] quiet mode"
          - "mute [the] announcements"
  JarvisQuietOff:
    data:
      - sentences:
          - "quiet mode off"
          - "turn off quiet mode"
          - "unmute [the] announcements"
  JarvisThanks:
    data:
      - sentences:
          - "thank you [jarvis]"
          - "thanks [jarvis]"
          - "good (job | work) [jarvis]"
  JarvisWisdom:
    data:
      - sentences:
          - "[give me] [some] wisdom [jarvis]"
          - "inspire me [jarvis]"
          - "[give me a] quote of the day"
          - "say something (wise | smart | profound)"
  JarvisSarcasm:
    data:
      - sentences:
          - "yeah right [jarvis]"
          - "whatever [jarvis]"
          - "sure you (did | do) [jarvis]"
          - "(oh really | very funny) [jarvis]"
  JarvisRemember:
    data:
      - sentences:
          - "remember that {fact}"
          - "remember {fact}"
          - "make a note that {fact}"
  JarvisRecall:
    data:
      - sentences:
          - "what did I ask you to remember"
          - "what do you remember"
          - "read [me] (my | your) (notes | memories)"
          - "memory check"
  JarvisForget:
    data:
      - sentences:
          - "forget (that | the last thing)"
          - "never mind that note"
  JarvisMedsTaken:
    data:
      - sentences:
          - "I took my (medication | meds | medicine)"
          - "medication taken"
          - "[I] took my pills"
  JarvisDiagnostic:
    data:
      - sentences:
          - "run a [self] diagnostic"
          - "[run a] system (check | diagnostic)"
          - "how are you (feeling | doing) [jarvis]"
          - "diagnostic report"
  JarvisJoke:
    data:
      - sentences:
          - "tell me a joke [jarvis]"
          - "make me laugh [jarvis]"
          - "[tell me] another joke"
  JarvisFunFact:
    data:
      - sentences:
          - "[tell me a] (fun | random) fact"
          - "teach me something [new]"
  JarvisCompliment:
    data:
      - sentences:
          - "compliment me [jarvis]"
          - "say something nice [about me]"
  JarvisBored:
    data:
      - sentences:
          - "I'm bored [jarvis]"
          - "I am bored [jarvis]"
          - "entertain me [jarvis]"
  JarvisAdvice:
    data:
      - sentences:
          - "[give me] [some] [life] advice [jarvis]"
          - "what should I do [jarvis]"
  JarvisDeepThoughts:
    data:
      - sentences:
          - "what are you thinking [about] [jarvis]"
          - "[tell me your] deep thoughts"
          - "get philosophical [jarvis]"
  JarvisWouldYouRather:
    data:
      - sentences:
          - "[give me a] would you rather [question]"
          - "play would you rather"
  JarvisLove:
    data:
      - sentences:
          - "I love you [jarvis]"
          - "you're (awesome | amazing | the best) [jarvis]"
          - "you are (awesome | amazing | the best) [jarvis]"
  JarvisIronMan:
    data:
      - sentences:
          - "I am iron man"
          - "are you iron man['s] [jarvis | assistant]"
  JarvisRPS:
    data:
      - sentences:
          - "rock paper scissors [I (pick | choose)] {rps}"
          - "[let's play] rock paper scissors [I (pick | choose)] {rps}"
          - "I (pick | choose) {rps}"
  JarvisParty:
    data:
      - sentences:
          - "party time [jarvis]"
          - "(let's | lets) party [jarvis]"
          - "[activate] party mode"
  JarvisGoodMorning:
    data:
      - sentences:
          - "good morning [jarvis]"
          - "morning [jarvis]"
          - "[jarvis] I'm (up | awake)"
  JarvisGoodnight:
    data:
      - sentences:
          - "good night [jarvis]"
          - "goodnight [jarvis]"
          - "[jarvis] I'm going to (bed | sleep)"
          - "[jarvis] time for bed"
  JarvisWeather:
    data:
      - sentences:
          - "(what's | what is | how's | how is) the weather [like] [today | outside | right now]"
          - "(is it | will it be) (cold | hot | raining | rainy) [today | outside]"
          - "(what's | what is) it like outside"
          - "do I need a jacket [today]"
  JarvisCoinFlip:
    data:
      - sentences:
          - "flip a coin [jarvis]"
          - "[jarvis] heads or tails"
          - "coin (flip | toss)"
  JarvisDice:
    data:
      - sentences:
          - "roll (a die | the dice | a dice) [jarvis]"
          - "[jarvis] roll for me"
  JarvisCapabilities:
    data:
      - sentences:
          - "what can you do [jarvis]"
          - "[jarvis] what are your (capabilities | features | skills)"
          - "help [me] [jarvis] what do you do"

lists:
  grams:
    range:
      from: 1
      to: 300
  amount:
    range:
      from: 1
      to: 100000
  account:
    wildcard: true
  bill:
    wildcard: true
  message:
    wildcard: true
  task:
    wildcard: true
  fact:
    wildcard: true
  minutes:
    range:
      from: 1
      to: 480
  merchant:
    wildcard: true
  item:
    wildcard: true
  meal:
    wildcard: true
  due_day:
    wildcard: true
  slot:
    values:
      - breakfast
      - lunch
      - dinner
      - snack
  pounds:
    range:
      from: 60
      to: 500
  steps:
    range:
      from: 0
      to: 60000
  glasses:
    range:
      from: 1
      to: 20
  goal:
    wildcard: true
  rps:
    values:
      - rock
      - paper
      - scissors
