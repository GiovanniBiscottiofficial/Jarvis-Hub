# Ask Jarvis about LifeOS by voice (Assist). Answers live in intents.yaml.
language: en
intents:
  LifeOSProtein:
    data:
      - sentences:
          - "how much protein [do I have] left [today]"
          - "how's my protein [today]"
          - "protein check"
          - "am I hitting my protein [target]"
  LifeOSSteps:
    data:
      - sentences:
          - "how many steps [do I have] [today]"
          - "how's my steps [today]"
          - "step check"
  LifeOSBills:
    data:
      - sentences:
          - "what bills are due [this week]"
          - "do I have [any] bills due [soon]"
          - "bill check"
  LifeOSMoney:
    data:
      - sentences:
          - "how much money do I have [left]"
          - "what's left after bills"
          - "money check"
          - "vault check"
  LifeOSMeals:
    data:
      - sentences:
          - "what can I eat"
          - "what can I make [for dinner]"
          - "what should I eat"
          - "meal ideas"
  LifeOSDinner:
    data:
      - sentences:
          - "what('s | is )for dinner [tonight]"
          - "what should I (make | eat) for dinner"
          - "dinner ideas"
  LifeOSBriefing:
    data:
      - sentences:
          - "brief me"
          - "[give me] [the] morning briefing"
          - "what's my day look [ing] like"
  LifeOSWeeklyReview:
    data:
      - sentences:
          - "how did I do this week"
          - "[give me] [the] weekly review"
          - "how was my week"
  LifeOSTakeVitamins:
    data:
      - sentences:
          - "I took my vitamins [today]"
          - "log [my] vitamins"
          - "vitamins done"
  LifeOSLogProtein:
    data:
      - sentences:
          - "log {grams} grams of protein"
          - "add {grams} grams of protein"
          - "I ate {grams} grams of protein"
  LifeOSWeighIn:
    data:
      - sentences:
          - "log a weigh in of {pounds} [pounds]"
          - "I weigh {pounds} [pounds]"
          - "log [my] weight [at] {pounds} [pounds]"
  LifeOSSetSteps:
    data:
      - sentences:
          - "log {steps} steps [today]"
          - "set [my] steps to {steps}"
  LifeOSWorkout:
    data:
      - sentences:
          - "I did my workout"
          - "I finished my workout"
          - "log a workout"
          - "I worked out"
          - "workout done"
  LifeOSTreat:
    data:
      - sentences:
          - "I'm having a treat [today]"
          - "log a treat"
          - "treat time"
  # Must come before LifeOSDeposit: "add 50 to my vacation fund" would
  # otherwise match the deposit wildcard with account="my vacation fund".
  LifeOSGoalContribute:
    data:
      - sentences:
          - "add {amount} [dollars] to my {goal} fund"
          - "put {amount} [dollars] in [my] {goal} fund"
          - "save {amount} [dollars] for {goal}"
  LifeOSDeposit:
    data:
      - sentences:
          - "log a deposit of {amount} [dollars] to {account}"
          - "add {amount} [dollars] to {account}"
          - "{account} got a deposit of {amount} [dollars]"
  LifeOSBillPaid:
    data:
      - sentences:
          - "mark {bill} [as] paid"
          - "I paid [the] {bill} [bill]"
          - "{bill} is paid"
  LifeOSAddBill:
    data:
      - sentences:
          - "add a bill called {bill} for {amount} [dollars] due [on] [the] {due_day}"
          - "add a bill {bill} for {amount} [dollars] due [on] [the] {due_day}"
          - "new bill {bill} {amount} [dollars] due [on] [the] {due_day}"
  LifeOSAddAccount:
    data:
      - sentences:
          - "add an account called {account}"
          - "create [an] account [called] {account}"
  LifeOSSpend:
    data:
      - sentences:
          - "I spent {amount} [dollars] at {merchant}"
          - "log spending of {amount} [dollars] at {merchant}"
      - sentences:
          - "I spent {amount} [dollars]"
          - "log spending of {amount} [dollars]"
        slots:
          merchant: ""
  LifeOSSpendCheck:
    data:
      - sentences:
          - "how much have I spent [this week]"
          - "spending check"
          - "what's my spending [this week]"
  LifeOSGroceryAdd:
    data:
      - sentences:
          - "add {item} to [the] grocery list"
          - "put {item} on [the] grocery list"
          - "we're out of {item}"
          - "we are out of {item}"
  LifeOSGroceryList:
    data:
      - sentences:
          - "what('s | is )on the grocery list"
          - "read [me] the grocery list"
          - "grocery [list] check"
  LifeOSGroceryRemove:
    data:
      - sentences:
          - "take {item} off [of] [the] grocery list"
          - "remove {item} from [the] grocery list"
          - "cross {item} off [the] grocery list"
  LifeOSGroceryClear:
    data:
      - sentences:
          - "clear the grocery list"
          - "empty the grocery list"
  LifeOSLogUsual:
    data:
      - sentences:
          - "log my usual {slot}"
          - "I had my usual {slot}"
  LifeOSSetUsual:
    data:
      - sentences:
          - "set my usual {slot} to {meal}"
          - "my usual {slot} is {meal}"
  LifeOSWater:
    data:
      - sentences:
          - "log {glasses} glasses of water"
          - "I drank {glasses} glasses of water"
      - sentences:
          - "log a glass of water"
          - "I drank a glass of water"
          - "water down"
        slots:
          glasses: 1
  LifeOSWaterCheck:
    data:
      - sentences:
          - "how much water have I had [today]"
          - "how's my water [today]"
          - "water check"
  LifeOSGoalsCheck:
    data:
      - sentences:
          - "how are my savings [goals]"
          - "savings check"
          - "how much have I saved"
  JarvisEveningReport:
    data:
      - sentences:
          - "[give me the] evening report"
          - "how did I do today"
          - "recap my day"
          - "end of day report"
  JarvisTimer:
    data:
      - sentences:
          - "set a timer for {minutes} minutes"
          - "[start a] timer for {minutes} minutes"
          - "start a {minutes} minute timer"
  JarvisCancelReminders:
    data:
      - sentences:
          - "cancel [all] [my] reminders"
          - "cancel [all] [my] timers"
          - "cancel the (reminder | timer)"
  JarvisHouseStatus:
    data:
      - sentences:
          - "is the house ready for the night"
          - "house status [report]"
          - "status report"
          - "how's the house [looking]"
  JarvisRemind:
    data:
      - sentences:
          - "remind me to {task} in {minutes} minutes"
          - "set a reminder to {task} in {minutes} minutes"
          - "in {minutes} minutes remind me to {task}"
  JarvisAnnounce:
    data:
      - sentences:
          - "announce {message}"
          - "tell everyone [that] {message}"
          - "tell the house [that] {message}"
  JarvisWakeUp:
    data:
      - sentences:
          - "wake up"
          - "come online"
          - "full system startup"
          - "initialize [all] systems"
          - "power up"
  JarvisMoodSupport:
    data:
      - sentences:
          - "I'm having a (bad | rough | terrible) day"
          - "I've had a (bad | rough | terrible) day"
          - "I'm (stressed | frustrated | overwhelmed) [out]"
          - "today (sucked | was awful)"
  JarvisQuietOn:
    data:
      - sentences:
          - "quiet mode on"
          - "[turn on] quiet mode"
          - "mute [the] announcements"
  JarvisQuietOff:
    data:
      - sentences:
          - "quiet mode off"
          - "turn off quiet mode"
          - "unmute [the] announcements"
  JarvisThanks:
    data:
      - sentences:
          - "thank you [jarvis]"
          - "thanks [jarvis]"
          - "good (job | work) [jarvis]"

lists:
  grams:
    range:
      from: 1
      to: 300
  amount:
    range:
      from: 1
      to: 100000
  account:
    wildcard: true
  bill:
    wildcard: true
  message:
    wildcard: true
  task:
    wildcard: true
  minutes:
    range:
      from: 1
      to: 480
  merchant:
    wildcard: true
  item:
    wildcard: true
  meal:
    wildcard: true
  due_day:
    wildcard: true
  slot:
    values:
      - breakfast
      - lunch
      - dinner
      - snack
  pounds:
    range:
      from: 60
      to: 500
  steps:
    range:
      from: 0
      to: 60000
  glasses:
    range:
      from: 1
      to: 20
  goal:
    wildcard: true
