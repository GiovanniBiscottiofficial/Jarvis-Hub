# Environmental awareness: weather + air quality reactions.
# Wind/rain sensors come free with any weather integration (Settings ->
# Add Integration -> Met.no / AccuWeather / OpenWeatherMap).
# EDIT: weather.forecast_home to your weather entity; cover/fan entities if you have them.

# Storm prep: high wind -> secure the house and announce it.
- id: jarvis_storm_prep
  alias: "Environment: storm preparation"
  trigger:
    - platform: template
      value_template: >-
        {{ (state_attr('weather.forecast_home', 'wind_speed') | float(0)) > 30 }}
  mode: single
  action:
    # - service: cover.close_cover
    #   target:
    #     entity_id: cover.patio
    - service: notify.mobile_app_phone
      data:
        title: "Storm watch"
        message: >-
          Wind is at {{ state_attr('weather.forecast_home', 'wind_speed') }} —
          consider securing anything loose outside.
    - service: script.jarvis_say
      data:
        message: "High winds detected. You may want to secure the patio."
    # Don't re-announce for 3 hours even if wind stays high
    - delay: "03:00:00"

# Rain incoming -> heads-up before you leave (pairs with the leaving NFC tag).
- id: jarvis_rain_warning
  alias: "Environment: rain expected today"
  trigger:
    - platform: time
      at: "07:45:00"
  condition:
    - condition: template
      value_template: >-
        {{ states('weather.forecast_home') in ['rainy', 'pouring', 'lightning',
                                               'lightning-rainy', 'snowy-rainy'] }}
  action:
    - service: script.jarvis_say
      data:
        message: "Rain is expected today — take a jacket, sir."

