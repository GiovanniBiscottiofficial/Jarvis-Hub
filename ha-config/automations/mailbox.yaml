# Mail / package watch.
# Option A (cheap): a $12 Zigbee vibration sensor inside the mailbox lid →
# binary_sensor.mailbox_vibration. Option B: a camera + Frigate person/box
# detection at the door (see PLAN Phase 13 Tier 3).

- id: mailbox_alert
  alias: "Mailbox: mail has arrived"
  trigger:
    - platform: state
      entity_id: binary_sensor.mailbox_vibration
      to: "on"
  condition:
    - condition: time
      after: "08:00:00"
      before: "20:00:00"
  action:
    - service: notify.jarvis_phone
      data:
        title: "Mail"
        message: "Something just landed in the mailbox."
    - service: script.jarvis_say
      data:
        message: "Mail has arrived."
