# Movie's over -> bring the lights back gently (after the credits pause).
- id: jarvis_movie_over
  alias: "Entertainment: lights back after the movie"
  trigger:
    - platform: state
      entity_id: media_player.fire_tv
      from: "playing"
      to: "idle"
      for: "00:03:00"
  condition:
    - condition: sun
      after: sunset
  action:
    - service: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 40
        kelvin: 2700
        transition: 5
