# Proactive intelligence: Jarvis speaks up before you ask.

# Workday Sunrise start: a short cue before the full 7:00 briefing. Once your work
# calendar is integrated (Settings -> Add Integration -> Google Calendar),
# uncomment the calendar condition to make it schedule-aware.
- id: jarvis_morning_prediction
  alias: "Proactive: workday wake-up"
  trigger:
    - platform: time
      at: "06:30:00"
  condition:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
    # - condition: state
    #   entity_id: calendar.work
    #   state: "on"
  action:
    - service: script.jarvis_say
      data:
        message: >-
          Good morning, Giovanni. Sunrise mode is underway. Your full briefing
          follows at seven.

# Out-the-door nudge follows Giovanni's actual presence instead of assuming
# he is still home at 7:30.
- id: jarvis_leave_for_work
  alias: "Proactive: time to leave for work"
  trigger:
    - platform: time
      at: "07:10:00"
  condition:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
    - condition: state
      entity_id: person.giovanni_biscotti
      state: home
  action:
    - service: script.jarvis_say
      data:
        message: >-
          Giovanni, your morning launch window is open. Take your vitamins,
          grab what you need, and head out when you're ready.

# Evening workout nudge: Giovanni is building the evening-workout habit.
# Weekdays at 6:30 PM — home from work, fed or about to be. Encouraging,
# never shaming; say "I did my workout" to log it.
- id: jarvis_workout_nudge
  alias: "Proactive: evening workout nudge"
  trigger:
    - platform: time
      at: "18:30:00"
  condition:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
  action:
    - service: notify.jarvis_phone
      data:
        title: "Workout"
        message: "Evening session, Giovanni? Even 15 minutes keeps the habit alive."
        data:
          channel: health

# Payday heads-up uses LifeOS's weekend-aware payroll calendar.
- id: jarvis_payday
  alias: "Proactive: payday heads-up"
  trigger:
    - platform: time
      at: "07:02:00"
  condition:
    - condition: template
      value_template: >-
        {% set checks = state_attr('sensor.lifeos_morning_briefing', 'paydays') or [] %}
        {{ checks | count > 0 and checks[0].date == now().date().isoformat() }}
  action:
    - service: script.jarvis_say
      data:
        message: >-
          Payday, Giovanni.
          {{ state_attr('sensor.lifeos_answers', 'bills')
             or 'A fine day to check Vault Flow before the money gets ideas.' }}
    - service: notify.jarvis_phone
      data:
        title: "Payday"
        message: "Deposit day. Vault Flow is ready when you are."
        data:
          channel: money

# Dinner nudge: pantry-matched pick + protein still needed today.
# Uses the same live LifeOS answer as "hey Jarvis, what's for dinner".
# 4 PM on weekends; 5:30 PM on workdays (no point announcing to an
# empty house while Giovanni is at work until 5).
- id: jarvis_dinner_nudge
  alias: "Proactive: dinner suggestion"
  trigger:
    - platform: time
      at: "16:00:00"
      id: weekend
    - platform: time
      at: "17:30:00"
      id: workday
  condition:
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
    - condition: or
      conditions:
        - condition: and
          conditions:
            - condition: trigger
              id: weekend
            - condition: time
              weekday: [sat, sun]
        - condition: and
          conditions:
            - condition: trigger
              id: workday
            - condition: time
              weekday: [mon, tue, wed, thu, fri]
  action:
    - service: script.jarvis_say
      data:
        message: >-
          Thinking about dinner?
          {{ state_attr('sensor.lifeos_answers', 'dinner')
             or 'Check the LifeOS pantry for ideas.' }}
