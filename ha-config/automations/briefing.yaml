# LifeOS briefings, read aloud by Jarvis (script.jarvis_say uses Piper
# automatically once voice is set up). Swap the speaker placeholder in
# scripts/jarvis_say.yaml for your real speaker/satellite.

- id: lifeos_morning_briefing
  alias: "LifeOS: morning briefing"
  trigger:
    - platform: time
      at: "07:30:00"
  condition:
    - condition: state
      entity_id: zone.home
      state: "1"
      # only speak when someone is home
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
  action:
    - service: script.jarvis_say
      data:
        message: >-
          {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
             or 'Good morning. LifeOS is not reachable right now.' }}

- id: lifeos_weekly_review
  alias: "LifeOS: Sunday weekly review"
  trigger:
    - platform: time
      at: "18:00:00"
  condition:
    - condition: time
      weekday: [sun]
  action:
    - service: script.jarvis_say
      data:
        message: >-
          {{ state_attr('sensor.lifeos_weekly_review', 'speech')
             or 'Weekly review is not available right now.' }}
    - service: notify.mobile_app_phone
      data:
        title: "Weekly review"
        message: >-
          {{ state_attr('sensor.lifeos_weekly_review', 'speech') }}
