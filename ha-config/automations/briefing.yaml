# LifeOS briefings, read aloud by Jarvis (script.jarvis_say uses Piper
# automatically once voice is set up). Swap the speaker placeholder in
# scripts/jarvis_say.yaml for your real speaker/satellite.

- id: lifeos_morning_briefing
  alias: "LifeOS: morning briefing"
  trigger:
    - platform: time
      at: "07:00:10"
  condition:
    - condition: state
      entity_id: person.giovanni_biscotti
      state: home
      # only speak when Giovanni is still home
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
  action:
    - service: script.jarvis_say
      data:
        message: >-
          {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
             or 'Good morning, Giovanni. LifeOS is not reachable right now. Take your vitamins, choose something to thaw for dinner, and begin with confidence.' }}

- id: lifeos_weekly_review
  alias: "LifeOS: Sunday weekly review"
  trigger:
    - platform: time
      at: "18:00:00"
  condition:
    - condition: time
      weekday: [sun]
  action:
    - service: script.jarvis_say
      data:
        message: >-
          {{ state_attr('sensor.lifeos_weekly_review', 'speech')
             or 'Weekly review is not available right now.' }}
    - service: notify.jarvis_phone
      data:
        title: "Weekly review"
        message: >-
          {{ state_attr('sensor.lifeos_weekly_review', 'speech') }}
