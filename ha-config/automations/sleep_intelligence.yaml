# Sleep intelligence: wind the house down when you do, wake it gently.
# Placeholders: binary_sensor.phone_is_charging comes from the HA Companion
# app (enable the "Is Charging" sensor); binary_sensor.living_room_motion is
# any motion sensor; light.bedroom / light.living_room are your lights.

- id: sleep_mode_on
  alias: "Sleep: house shuts down when you do"
  trigger:
    - platform: state
      entity_id: binary_sensor.phone_is_charging
      to: "on"
  condition:
    - condition: time
      after: "23:00:00"
      before: "04:00:00"
    - condition: state
      entity_id: binary_sensor.living_room_motion
      state: "off"
      for: "00:20:00"
    - condition: state
      entity_id: input_boolean.sleep_mode
      state: "off"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.sleep_mode
    - service: script.goodnight
    - service: vacuum.set_fan_speed
      target:
        entity_id: vacuum.juno
      data:
        fan_speed: quiet
      # queue tomorrow's clean quietly; remove if unsupported

- id: gentle_wakeup
  alias: "Sleep: fade lights in before the alarm"
  # The HA Companion app exposes your phone's next alarm as
  # sensor.phone_next_alarm — this fires 15 minutes before it.
  trigger:
    - platform: template
      value_template: >-
        {{ states('sensor.phone_next_alarm') not in ['unavailable','unknown']
           and (as_timestamp(states('sensor.phone_next_alarm')) - 900)
               <= as_timestamp(now()) }}
  condition:
    - condition: state
      entity_id: input_boolean.sleep_mode
      state: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness_pct: 10
        transition: 600
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.sleep_mode
