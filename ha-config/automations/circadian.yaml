# Circadian rhythm lighting: color temperature follows the sun — cool and
# energizing by day, warm and sleepy at night. Only adjusts lights that are
# already on (never switches anything on), and only while the toggle
# input_boolean.circadian_lighting is enabled. EDIT: the light entities.

- id: jarvis_circadian_lighting
  alias: "Circadian: adaptive color temperature"
  trigger:
    - platform: time_pattern
      minutes: "/30"
  condition:
    - condition: state
      entity_id: input_boolean.circadian_lighting
      state: "on"
    - condition: state
      entity_id: input_boolean.quiet_mode
      state: "off"
    - condition: state
      entity_id: light.living_room
      state: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.living_room
      data:
        kelvin: >-
          {% set hour = now().hour %}
          {% if hour < 6 %} 2200
          {% elif hour < 9 %} 3500
          {% elif hour < 17 %} 4500
          {% elif hour < 20 %} 3200
          {% else %} 2400
          {% endif %}
        transition: 30

# Perfect morning: sunrise simulation — the bedroom light ramps up gently
# over 15 minutes before the 6:30 briefing, so waking up isn't a lightswitch
# to the face. EDIT: light.bedroom.
- id: jarvis_gradual_wake
  alias: "Circadian: gradual wake-up ramp"
  trigger:
    - platform: time
      at: "06:15:00"
  condition:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
  action:
    - service: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness: 3
        kelvin: 2200
    - delay: "00:05:00"
    - service: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness: 40
        kelvin: 2700
        transition: 60
    - delay: "00:05:00"
    - service: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness: 120
        kelvin: 3500
        transition: 60
    # Coffee maker on a smart plug? Uncomment and it starts brewing here.
    # - service: switch.turn_on
