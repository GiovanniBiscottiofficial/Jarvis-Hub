# Jarvis announces LifeOS nudges (food-override money reminders, etc.)
# through the house and your phone, then marks them handled so they
# only fire once. Swap the speaker/notify placeholders for your real ones.

- id: lifeos_nudge_announce
  alias: "LifeOS: announce new nudges"
  trigger:
    - platform: state
      entity_id: sensor.lifeos_answers
      attribute: nudge
  condition:
    - condition: template
      value_template: >-
        {{ (state_attr('sensor.lifeos_answers', 'nudge') or '') | length > 0 }}
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.sleep_mode
      state: "off"
  action:
    - service: tts.google_translate_say
      data:
        entity_id: media_player.living_room_speaker
        message: "{{ state_attr('sensor.lifeos_answers', 'nudge') }}"
    - service: notify.mobile_app_phone
      data:
        title: "Jarvis nudge"
        message: "{{ state_attr('sensor.lifeos_answers', 'nudge') }}"
    - service: rest_command.lifeos_resolve_nudge
      data:
        nudge_id: "{{ state_attr('sensor.lifeos_answers', 'nudge_id') }}"
