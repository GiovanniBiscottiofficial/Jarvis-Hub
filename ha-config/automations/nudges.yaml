# Jarvis announces LifeOS nudges (food-override money reminders, etc.)
# through the house and your phone, then marks them handled so they
# only fire once. Swap the speaker/notify placeholders for your real ones.

- id: lifeos_nudge_announce
  alias: "LifeOS: announce new nudges"
  trigger:
    - platform: state
      entity_id: sensor.lifeos_answers
      attribute: nudge
  condition:
    - condition: template
      value_template: >-
        {{ (state_attr('sensor.lifeos_answers', 'nudge') or '') | length > 0 }}
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.sleep_mode
      state: "off"
  action:
    - service: script.jarvis_say
      data:
        message: "{{ state_attr('sensor.lifeos_answers', 'nudge') }}"
    - service: notify.jarvis_phone
      data:
        title: "Jarvis nudge"
        message: "{{ state_attr('sensor.lifeos_answers', 'nudge') }}"
    - service: rest_command.lifeos_resolve_nudge
      data:
        nudge_id: "{{ state_attr('sensor.lifeos_answers', 'nudge_id') }}"

# Fires once when month-to-date spending (voice-logged into LifeOS)
# crosses the monthly budget cap set in input_number.monthly_budget.
- id: lifeos_budget_alert
  alias: "Vault Flow: monthly budget crossed"
  trigger:
    - platform: template
      value_template: >-
        {{ states('sensor.lifeos_monthly_spending') | float(0)
           > states('input_number.monthly_budget') | float(2000) }}
  action:
    - service: notify.jarvis_phone
      data:
        title: "Budget"
        message: >-
          You've spent ${{ states('sensor.lifeos_monthly_spending') }} this
          month — past your ${{ states('input_number.monthly_budget') | int }}
          budget, sir.
    - service: script.jarvis_say
      data:
        message: >-
          A word, sir — this month's spending just crossed your
          {{ states('input_number.monthly_budget') | int }} dollar budget.

# Zero-leakage guard: fires when the budget audit flips to "action needed"
# (OnePay can no longer cover what's still committed this paycheck).
- id: lifeos_budget_audit_alert
  alias: "Budget: audit needs action"
  trigger:
    - platform: state
      entity_id: sensor.lifeos_safe_to_spend
      attribute: audit
      to: "action needed"
  action:
    - service: notify.jarvis_phone
      data:
        title: "Budget audit"
        message: >-
          {{ state_attr('sensor.lifeos_safe_to_spend', 'audit_note') }}
    - service: script.jarvis_say
      data:
        message: >-
          Sir, the budget audit flagged a shortfall.
          {{ state_attr('sensor.lifeos_safe_to_spend', 'audit_note') }}
