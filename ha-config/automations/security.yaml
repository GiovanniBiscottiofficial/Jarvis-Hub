# Threat detection: front door opens while nobody's home -> rich actionable
# alert with a camera snapshot and one-tap responses.
# EDIT: binary_sensor.front_door (any $15 Zigbee door sensor).
- id: jarvis_threat_detection
  alias: "Security: entry while away"
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
    - condition: state
      entity_id: person.giovanni
      state: "not_home"
  action:
    - service: camera.snapshot
      target:
        entity_id: camera.front_door
      data:
        filename: /config/www/snapshots/last_entry.jpg
    - service: notify.jarvis_phone
      data:
        title: "⚠️ Entry while away"
        message: "The front door just opened and you're not home."
        data:
          image: /local/snapshots/last_entry.jpg
          importance: high
          ttl: 0
          priority: high
          channel: security
          actions:
            - action: "JARVIS_SOUND_ALARM"
              title: "Sound alarm"
            - action: "JARVIS_LOCK_DOOR"
              title: "Lock door"
            - action: "JARVIS_IGNORE"
              title: "It's fine"
    - service: script.jarvis_say
      data:
        message: "Attention. The front door has opened while the house is empty."

# One-tap responses from the notification above.
- id: jarvis_threat_sound_alarm
  alias: "Security: sound alarm action"
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: "JARVIS_SOUND_ALARM"
  action:
    - service: light.turn_on
      target:
        entity_id: all
      data:
        brightness: 255
    - service: script.jarvis_say
      data:
        message: "Intruder alert. The authorities can be contacted from your phone. This property is monitored."

- id: jarvis_threat_lock_door
  alias: "Security: lock door action"
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: "JARVIS_LOCK_DOOR"
  action:
    - service: lock.lock
      target:
        entity_id: lock.front_door

