# The X1's battery is a built-in UPS: when the house loses power the hub
# keeps running on battery, notices the AC adapter dropped, and alerts
# your phone. Uses the laptop's own power sensors (configuration.yaml,
# "command_line") — no extra hardware needed.

- id: power_outage
  alias: "Power: outage detected"
  trigger:
    - platform: state
      entity_id: binary_sensor.mains_power
      from: "on"
      to: "off"
      for: "00:02:00"
  action:
    - service: notify.mobile_app_phone
      data:
        title: "Power outage"
        message: >-
          The house lost power. The hub is running on battery
          ({{ states('sensor.x1_battery') }}%).
    - service: persistent_notification.create
      data:
        title: "Power outage"
        message: >-
          Mains power dropped at {{ now().strftime('%-I:%M %p') }}.
          Hub battery: {{ states('sensor.x1_battery') }}%.
    - service: script.jarvis_say
      data:
        message: "Heads up — the power just went out. I'm running on battery."

- id: power_restored
  alias: "Power: restored"
  trigger:
    - platform: state
      entity_id: binary_sensor.mains_power
      from: "off"
      to: "on"
      for: "00:01:00"
  action:
    - service: notify.mobile_app_phone
      data:
        title: "Power restored"
        message: "Mains power is back. Hub battery: {{ states('sensor.x1_battery') }}%."

- id: power_battery_critical
  alias: "Power: hub battery critical"
  trigger:
    - platform: numeric_state
      entity_id: sensor.x1_battery
      below: 20
  condition:
    - condition: state
      entity_id: binary_sensor.mains_power
      state: "off"
  action:
    - service: notify.mobile_app_phone
      data:
        title: "Hub battery critical"
        message: >-
          Still no power and the hub is at
          {{ states('sensor.x1_battery') }}% — it will shut down soon.
    - service: script.jarvis_say
      data:
        message: >-
          Battery critical. If power doesn't return soon I'll shut myself
          down safely at ten percent.
        urgent: true

# The host-side watchdog installed by bootstrap/setup-x1.sh does the actual
# safe power-off at 10% (stops the containers cleanly first) — it works even
# if Home Assistant itself is struggling.

- id: power_cpu_overheat
  alias: "Power: CPU overheating"
  trigger:
    - platform: numeric_state
      entity_id: sensor.x1_cpu_temperature
      above: 85
      for: "00:05:00"
  action:
    - service: notify.mobile_app_phone
      data:
        title: "Hub running hot"
        message: >-
          CPU at {{ states('sensor.x1_cpu_temperature') }}°C for 5+ minutes.
          Check ventilation — is something blocking the vents?
    - service: script.jarvis_say
      data:
        message: "I'm running a little hot, sir. Some airflow would be appreciated."

# Disk-space guard: nightly backups quietly stop working if the disk fills.
# Warn well before that point so old backups/media can be pruned in time.
- id: power_disk_space_low
  alias: "System: disk filling up"
  trigger:
    - platform: numeric_state
      entity_id: sensor.system_monitor_disk_usage
      above: 85
      for: "00:10:00"
  mode: single
  action:
    - service: notify.mobile_app_phone
      data:
        title: "Hub disk almost full"
        message: >-
          Disk is at {{ states('sensor.system_monitor_disk_usage') }}% —
          backups will start failing if it fills. Prune old backups
          (~/jarvis-backups) or media to free space.
    - service: persistent_notification.create
      data:
        title: "Disk almost full"
        message: >-
          {{ states('sensor.system_monitor_disk_usage') }}% used.
          Nightly backups need free space — time to clean up.
    - service: script.jarvis_say
      data:
        message: >-
          Storage is getting tight, sir — the disk is at
          {{ states('sensor.system_monitor_disk_usage') | round(0) }} percent.
