# Predictive maintenance: HVAC filter by actual runtime, not the calendar.
# sensor.hvac_runtime_hours comes free once a thermostat is integrated —
# see the history_stats sensor in configuration.yaml.
- id: jarvis_hvac_filter
  alias: "Optimization: HVAC filter due"
  trigger:
    - platform: numeric_state
      entity_id: sensor.hvac_runtime_hours
      above: 500
  mode: single
  action:
    - service: notify.mobile_app_phone
      data:
        title: "Maintenance"
        message: "The HVAC filter has ~500 hours of runtime — time to swap it."
    - service: script.jarvis_say
      data:
        message: "Maintenance note: the HVAC filter is due for a replacement."
