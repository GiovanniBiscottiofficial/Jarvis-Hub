# Contextual awareness: the same trigger means different things at
# different times. EDIT: binary_sensor.bedroom_motion (any $10 Zigbee
# motion sensor) and light entity IDs.

# Midnight bathroom run: motion in the bedroom late at night gets a dim
# red glow (preserves night vision), not full brightness.
- id: jarvis_night_path_light
  alias: "Contextual: dim red night light on motion"
  trigger:
    - platform: state
      entity_id: binary_sensor.bedroom_motion
      to: "on"
  condition:
    - condition: time
      after: "22:00:00"
      before: "06:00:00"
    - condition: state
      entity_id: light.bedroom
      state: "off"
  action:
    - service: light.turn_on
      target:
        entity_id: light.bedroom
      data:
        brightness: 10
        rgb_color: [255, 100, 50]
    - wait_for_trigger:
        - platform: state
          entity_id: binary_sensor.bedroom_motion
          to: "off"
          for: "00:02:00"
      timeout: "00:10:00"
    - service: light.turn_off
      target:
        entity_id: light.bedroom

# Don't interrupt the movie: Jarvis's proactive announcements check
# sensor.current_activity (configuration.yaml) — this pauses the
# nudge announcements while you're watching TV.
- id: jarvis_quiet_during_tv
  alias: "Contextual: no announcements during a movie"
  trigger:
    - platform: state
      entity_id: sensor.current_activity
      to: "watching_tv"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.quiet_mode

- id: jarvis_unquiet_after_tv
  alias: "Contextual: resume announcements after the movie"
  trigger:
    - platform: state
      entity_id: sensor.current_activity
      from: "watching_tv"
      for: "00:05:00"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.quiet_mode
