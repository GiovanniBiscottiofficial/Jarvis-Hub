# Health routines: medication + hydration.

# Any scale that Home Assistant exposes as a standards-compliant weight sensor
# (including supported Tuya body-fat scales) flows straight into Body Ops.
- id: jarvis_home_assistant_scale_sync
  alias: "Health: sync Home Assistant weight sensor to LifeOS"
  mode: queued
  max: 5
  trigger:
    - platform: event
      event_type: state_changed
  condition:
    - condition: template
      value_template: >-
        {% set new = trigger.event.data.new_state %}
        {{ new is not none
           and new.entity_id.startswith('sensor.')
           and new.attributes.device_class == 'weight'
           and new.state not in ['unknown', 'unavailable', 'none', '']
           and (new.state | float(0)) > 0 }}
  action:
    - variables:
        raw_weight: "{{ trigger.event.data.new_state.state | float }}"
        weight_unit: >-
          {{ trigger.event.data.new_state.attributes.unit_of_measurement | default('lb') | lower }}
        weight_lb: >-
          {{ (raw_weight * 2.2046226218) | round(2)
             if weight_unit in ['kg', 'kilogram', 'kilograms']
             else raw_weight | round(2) }}
    - service: rest_command.lifeos_weighin
      data:
        pounds: "{{ weight_lb }}"
        source: "home_assistant:{{ trigger.event.data.entity_id }}"

# Morning vitamins reminder — 7:00 on purpose: Giovanni is out the door by
# 7:35, so the nudge lands before he leaves. Silenced for the day by saying
# "I took my vitamins" (logs to LifeOS), flipping input_boolean.medication_taken,
# or tapping "Taken" on the phone notification.
- id: jarvis_medication_reminder
  alias: "Health: morning vitamins reminder"
  trigger:
    - platform: time
      at: "07:10:00"
  condition:
    - condition: state
      entity_id: input_boolean.medication_taken
      state: "off"
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
    - condition: template
      value_template: >-
        {{ not state_attr('sensor.lifeos_morning_briefing', 'vitamins_taken') }}
  action:
    - service: notify.jarvis_phone
      data:
        title: "Vitamins"
        message: "Morning vitamins — small thing, big consistency."
        data:
          channel: health
          actions:
            - action: "JARVIS_MEDS_TAKEN"
              title: "Taken"
            - action: "JARVIS_MEDS_SNOOZE"
              title: "Remind in 30 min"

- id: jarvis_medication_taken_action
  alias: "Health: medication notification actions"
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: JARVIS_MEDS_TAKEN
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.medication_taken

- id: jarvis_medication_snooze_action
  alias: "Health: medication snooze"
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: JARVIS_MEDS_SNOOZE
  action:
    - delay: "00:30:00"
    - condition: state
      entity_id: input_boolean.medication_taken
      state: "off"
    - service: notify.jarvis_phone
      data:
        title: "Vitamins"
        message: "30 minutes later — vitamins still pending."
        data:
          channel: health
          actions:
            - action: "JARVIS_MEDS_TAKEN"
              title: "Taken"

- id: jarvis_medication_reset
  alias: "Health: reset medication flag at midnight"
  trigger:
    - platform: time
      at: "00:00:00"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.medication_taken

# Hydration nudge — every 2 hours during the day, only if behind on the
# real LifeOS water log. Tapping "Drank one" logs a glass straight to LifeOS.
- id: jarvis_hydration_nudge
  alias: "Health: hydration nudge"
  trigger:
    - platform: time_pattern
      hours: "/2"
  condition:
    - condition: time
      after: "09:59:00"
      before: "20:01:00"
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
    - condition: template
      value_template: >-
        {{ (state_attr('sensor.lifeos_answers', 'water_count') | int(0))
           < (state_attr('sensor.lifeos_answers', 'water_target') | int(8)) }}
  action:
    - service: notify.jarvis_phone
      data:
        title: "Hydration"
        message: >-
          {{ state_attr('sensor.lifeos_answers', 'water') or 'Time for a glass of water.' }}
        data:
          channel: health
          actions:
            - action: "JARVIS_WATER_LOGGED"
              title: "Drank one"

- id: jarvis_hydration_action
  alias: "Health: log water from notification"
  trigger:
    - platform: event
      event_type: mobile_app_notification_action
      event_data:
        action: JARVIS_WATER_LOGGED
  action:
    - service: rest_command.lifeos_water
      data:
        glasses: 1
