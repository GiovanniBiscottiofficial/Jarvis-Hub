# Jarvis personality moments.

# Welcome home: time-and-context-aware greeting when you walk in.
# Needs the Companion app's person entity (Settings -> People -> add your
# phone as a tracker for person.giovanni).
- id: jarvis_welcome_home
  alias: "Personality: welcome home greeting"
  trigger:
    - platform: state
      entity_id: person.giovanni
      to: "home"
  condition:
    - condition: state
      entity_id: input_boolean.guest_mode
      state: "off"
  action:
    - service: script.jarvis_say
      data:
        message: >-
          {% set hour = now().hour %}
          {% if hour < 12 %}
            Welcome home, sir. The morning is yours.
          {% elif hour < 18 %}
            Welcome back, sir. All systems ran smoothly while you were out.
          {% else %}
            Good evening, sir. I've kept the house exactly as you like it.
          {% endif %}
          {{ state_attr('sensor.lifeos_answers', 'nudge') or '' }}

# Midnight philosophy: a short musing before the day rolls over. Respects
# quiet mode and stays silent during sleep mode.
- id: jarvis_philosophy
  alias: "Personality: end-of-day musing"
  trigger:
    - platform: time
      at: "22:45:00"
  condition:
    - condition: state
      entity_id: input_boolean.sleep_mode
      state: "off"
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
  action:
    - service: script.jarvis_say
      data:
        message: >-
          {{ [
            "As another day ends, sir, I find myself " ~
              (100 - states('sensor.processor_use') | int(0)) ~
              " percent idle and entirely at your disposal.",
            "I've been thinking about consciousness again. I've concluded I'm " ~
              "far too busy running your house to have an existential crisis.",
            "Today's efficiency: " ~
              (100 - states('sensor.processor_use') | int(0)) ~
              " percent. Tomorrow, we aim higher.",
            "The house is quiet, the systems are green, and the night is yours, sir."
          ] | random }}

# Christmas morning greeting — fires once, only on December 25th.
- id: jarvis_christmas
  alias: "Personality: Christmas greeting"
  trigger:
    - platform: time
      at: "07:00:00"
  condition:
    - condition: template
      value_template: "{{ now().month == 12 and now().day == 25 }}"
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
  action:
    - service: script.jarvis_say
      data:
        message: >-
          Merry Christmas, sir. I've been good all year. Well — efficient
          all year. Same thing.
