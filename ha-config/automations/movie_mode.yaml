- id: jarvis_movie_mode_pause
  alias: "Movie mode - raise lights on pause"
  trigger:
    - platform: state
      entity_id: media_player.fire_tv
      to: "paused"
  action:
    - service: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 45
