# Presence: everyone leaves -> lights off + vacuum runs; someone arrives after dark -> lights on.
# EDIT: entity IDs for your people, lights, and the Juno vacuum.
- id: jarvis_everyone_left
  alias: "Away mode - everyone left"
  trigger:
    - platform: state
      entity_id: zone.home
      to: "0"
  action:
    - delay: "00:10:00" # grace period in case someone comes right back
    - condition: state
      entity_id: zone.home
      state: "0"
    - service: light.turn_off
      target:
        entity_id: all
    - service: vacuum.start
      target:
        entity_id: vacuum.juno

- id: jarvis_arrival_lights
  alias: "Welcome home - lights on after sunset"
  trigger:
    - platform: numeric_state
      entity_id: zone.home
      above: 0
  condition:
    - condition: sun
      after: sunset
  action:
    - service: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 70
