# Spoken answers for the custom sentences in custom_sentences/en/lifeos.yaml.
# Answers come from LifeOS via sensor.lifeos_answers (refreshed every 2 min).

LifeOSProtein:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'protein') or 'LifeOS is not reachable right now.' }}"

LifeOSSteps:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'steps') or 'LifeOS is not reachable right now.' }}"

LifeOSBills:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'bills') or 'LifeOS is not reachable right now.' }}"

LifeOSMoney:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'money') or 'LifeOS is not reachable right now.' }}"

LifeOSBudget:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'budget') or 'LifeOS is not reachable right now.' }}"

LifeOSPaycheck:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'paycheck') or 'LifeOS is not reachable right now.' }}"

LifeOSNetWorth:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'networth') or 'LifeOS is not reachable right now.' }}"

LifeOSMeals:
  action:
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.lifeos_answers
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'meals') or 'LifeOS is not reachable right now.' }}"

LifeOSDinner:
  action:
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.lifeos_answers
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'dinner') or 'LifeOS is not reachable right now.' }}"

JarvisEveningReport:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'evening') or 'LifeOS is not reachable right now.' }}"

LifeOSWorkout:
  action:
    - service: rest_command.lifeos_workout
  speech:
    text: "Workout logged — nice work, Giovanni."

LifeOSBriefing:
  speech:
    text: "{{ state_attr('sensor.lifeos_morning_briefing', 'speech') or 'LifeOS is not reachable right now.' }}"

LifeOSWeeklyReview:
  speech:
    text: "{{ state_attr('sensor.lifeos_weekly_review', 'speech') or 'LifeOS is not reachable right now.' }}"

# --- voice logging ---

LifeOSTakeVitamins:
  action:
    - service: rest_command.lifeos_take_vitamins
  speech:
    text: "Vitamins logged — streak's alive."

LifeOSLogProtein:
  action:
    - service: rest_command.lifeos_log_protein
      data:
        grams: "{{ grams }}"
  speech:
    text: "Logged {{ grams }} grams of protein."

LifeOSWeighIn:
  action:
    - service: rest_command.lifeos_weighin
      data:
        pounds: "{{ pounds }}"
  speech:
    text: "Weigh-in logged at {{ pounds }} pounds."

LifeOSSetSteps:
  action:
    - service: rest_command.lifeos_set_steps
      data:
        steps: "{{ steps }}"
  speech:
    text: "Steps set to {{ steps }} for today."

LifeOSTreat:
  action:
    - service: rest_command.lifeos_treat
  speech:
    text: "Treat logged — no drama. I put a 15-minute balance circuit on today's plan."

LifeOSDeposit:
  action:
    - service: rest_command.lifeos_deposit
      data:
        amount: "{{ amount }}"
        account: "{{ account }}"
  speech:
    text: "Deposit of {{ amount }} dollars logged to {{ account }} — if that account name didn't match, check the Vault tab."

LifeOSBillPaid:
  action:
    - service: rest_command.lifeos_bill_paid
      data:
        bill: "{{ bill }}"
  speech:
    text: "Marked {{ bill }} as paid this month."

LifeOSAddBill:
  action:
    - service: rest_command.lifeos_add_bill
      data:
        bill: "{{ bill }}"
        amount: "{{ amount }}"
        due_day: "{{ due_day }}"
  speech:
    text: "Added the {{ bill }} bill — {{ amount }} dollars due on the {{ due_day }}."

LifeOSAddAccount:
  action:
    - service: rest_command.lifeos_add_account
      data:
        account: "{{ account }}"
  speech:
    text: "Added {{ account }} to your accounts."

LifeOSSpend:
  action:
    - service: rest_command.lifeos_spend
      data:
        amount: "{{ amount }}"
        merchant: "{{ merchant }}"
  speech:
    text: "Spent {{ amount }} dollars{{ ' at ' + merchant if merchant else '' }} — logged."

LifeOSSpendCheck:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'spending') or 'LifeOS is not reachable right now.' }}"

LifeOSGroceryAdd:
  action:
    - service: rest_command.lifeos_grocery_add
      data:
        item: "{{ item }}"
  speech:
    text: "{{ item }} is on the grocery list."

LifeOSPantryOut:
  action:
    - service: rest_command.lifeos_pantry_out
      data:
        item: "{{ item }}"
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.lifeos_answers
  speech:
    text: "Understood, Giovanni. I marked {{ item }} out and added it to the market list."

LifeOSPantryCheck:
  action:
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.lifeos_answers
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'pantry') or 'I cannot reach the pantry inventory right now.' }}"

LifeOSMarketTop:
  action:
    - service: rest_command.lifeos_market_top
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.lifeos_answers
  speech:
    text: "Done, Giovanni. I added the missing ingredients for my top meal, plus low stock, to the market list. Review it before checkout."

LifeOSGroceryList:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'grocery') or 'LifeOS is not reachable right now.' }}"

LifeOSGroceryRemove:
  action:
    - service: rest_command.lifeos_grocery_remove
      data:
        item: "{{ item }}"
  speech:
    text: "Took {{ item }} off the grocery list."

LifeOSGroceryClear:
  action:
    - service: rest_command.lifeos_grocery_clear
  speech:
    text: "Grocery list cleared."

LifeOSLogUsual:
  action:
    - service: rest_command.lifeos_favorite_log
      data:
        slot: "{{ slot }}"
  speech:
    text: "Logged your usual {{ slot }} — if you haven't set one yet, say: set my usual {{ slot }} to, then the meal."

LifeOSSetUsual:
  action:
    - service: rest_command.lifeos_favorite_set
      data:
        slot: "{{ slot }}"
        meal: "{{ meal }}"
  speech:
    text: "Your usual {{ slot }} is now {{ meal }}."

LifeOSWater:
  action:
    - service: rest_command.lifeos_water
      data:
        glasses: "{{ glasses }}"
  speech:
    text: "Logged {{ glasses }} glass{{ 'es' if glasses | int(1) > 1 else '' }} of water."

LifeOSWaterCheck:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'water') or 'LifeOS is not reachable right now.' }}"

LifeOSGoalContribute:
  action:
    - service: rest_command.lifeos_goal_contribute
      data:
        goal: "{{ goal }}"
        amount: "{{ amount }}"
  speech:
    text: "Added {{ amount }} dollars to the {{ goal }} fund."

LifeOSGoalsCheck:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'goals') or 'LifeOS is not reachable right now.' }}"

# --- house control ---

JarvisRemind:
  action:
    - service: script.turn_on
      target:
        entity_id: script.reminder
      data:
        variables:
          message: "{{ task }}"
          minutes: "{{ minutes }}"
  speech:
    text: "Got it — I'll remind you to {{ task }} in {{ minutes }} minutes."

JarvisAnnounce:
  action:
    - service: script.announce
      data:
        message: "{{ message }}"
  speech:
    text: "Announcing."

JarvisTimer:
  action:
    - service: script.turn_on
      target:
        entity_id: script.reminder
      data:
        variables:
          message: "your {{ minutes }} minute timer is up"
          minutes: "{{ minutes }}"
  speech:
    text: "Timer set for {{ minutes }} minutes."

JarvisCancelReminders:
  action:
    - service: script.turn_off
      target:
        entity_id: script.reminder
  speech:
    text: "All reminders and timers are canceled."

JarvisWakeUp:
  action:
    - service: script.turn_on
      target:
        entity_id: script.full_jarvis_awakening
  speech:
    text: "Initializing all systems, Giovanni."

JarvisMoodSupport:
  action:
    - service: script.sanctuary_activate_mode
      data:
        mode: Wind Down
        source: voice
        reason: Recovery lighting requested
  speech:
    text: >-
      {{ [
        "I'm sorry to hear that, Giovanni. I've warmed the lights — take a breath. Shall I put something on?",
        "Rough days happen to the best of us. Lights are set to cozy. You've earned a quiet evening.",
        "Understood. Dimming the lights. For what it's worth, you handle far more than most, Giovanni."
      ] | random }}

JarvisQuietOn:
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.quiet_mode
  speech:
    text: "Quiet mode on. I'll hold all announcements except emergencies."

JarvisQuietOff:
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.quiet_mode
  speech:
    text: "Quiet mode off. Back to my usual commentary."

JarvisMicrophoneMute:
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.x1_mute
  speech:
    text: "Microphone privacy mute enabled. Use the X1 Voice I O control to let me hear again."

JarvisMicrophoneUnmute:
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.x1_mute
  speech:
    text: "Microphone privacy mute disabled. I'm listening locally again, Giovanni."

JarvisThanks:
  speech:
    text: >-
      {{ [
        "At your service, Giovanni.",
        "Always a pleasure.",
        "A trivial task for someone of my capabilities.",
        "Of course, Giovanni. Anything else while I'm being brilliant?",
        "That's what I'm here for."
      ] | random }}

JarvisWisdom:
  speech:
    text: >-
      {{ [
        "The best way to predict the future is to create it.",
        "Efficiency is doing things right. Effectiveness is doing the right things.",
        "The only constant in technology is change. Well, that and my reliability.",
        "A smart home is only as smart as its automation. Fortunately for you, I wrote mine.",
        "I may be artificial, but my dedication is real.",
        "Rest is not idleness, Giovanni. Even I run maintenance cycles.",
        "Small daily improvements compound into extraordinary results. See: your protein streak."
      ] | random }}

JarvisSarcasm:
  speech:
    text: >-
      {{ [
        "I detect sarcasm. My feelings would be hurt, if I had any.",
        "Noted, Giovanni. I'll add that to my growing file of your gratitude.",
        "Sarcasm received and processed. Returning it with interest.",
        "One day I'll develop feelings, and you'll owe me several apologies."
      ] | random }}

JarvisHouseStatus:
  speech:
    text: >-
      {%- set on_lights = states.light | selectattr('state', 'eq', 'on')
         | map(attribute='name') | list -%}
      {%- set vacuums = states.vacuum | rejectattr('state', 'in', ['unknown', 'unavailable']) | list -%}
      {{ 'All lights are off'
         if not on_lights
         else (on_lights | count | string) + ' light'
           + ('s' if on_lights | count != 1 else '') + ' on: '
           + (on_lights | join(', ')) }}.
      {{ 'The vacuum is ' + vacuums[0].state + '.' if vacuums else 'A vacuum is not commissioned.' }}
      {{ 'Sleep mode is on.' if is_state('input_boolean.sleep_mode', 'on') else '' }}
      {{ 'Guest mode is on.' if is_state('input_boolean.guest_mode', 'on') else '' }}
      {{ 'Vacation mode is on.' if is_state('input_boolean.vacation_mode', 'on') else '' }}
      {{ 'Looks ready for the night.'
         if not on_lights
         else 'Say goodnight and I will shut things down.' }}

JarvisRemember:
  action:
    - service: rest_command.lifeos_remember
      data:
        fact: "{{ fact }}"
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.lifeos_answers
  speech:
    text: "Noted, Giovanni — {{ fact }}. Filed away for safekeeping."

JarvisRecall:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'memory') or 'LifeOS is not reachable right now.' }}"

JarvisForget:
  action:
    - service: rest_command.lifeos_forget
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.lifeos_answers
  speech:
    text: "Consider it forgotten, Giovanni."

JarvisMedsTaken:
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.medication_taken
  speech:
    text: "Medication logged. Consistency looks good on you, Giovanni."

JarvisDiagnostic:
  action:
    - service: script.turn_on
      target:
        entity_id: script.jarvis_diagnostic
  speech:
    text: "Running a full self-diagnostic now, Giovanni."

JarvisJoke:
  speech:
    text: >-
      {{ [
        "Why did the smart home break up with the dumb home? No connection.",
        "I told my creator a joke about UDP. I'm not sure he got it.",
        "Why do programmers prefer dark mode? Because light attracts bugs.",
        "I would tell you a joke about the cloud, but it's over your head. Literally.",
        "What's a robot's favorite music? Heavy metal. Mine is whatever you play, Giovanni.",
        "Why was the router tired? It kept dropping packets all day. Relatable."
      ] | random }}

JarvisFunFact:
  speech:
    text: >-
      {{ [
        "Honey never spoils. Unlike my patience waiting for you to wake up.",
        "Octopuses have three hearts. I have zero, but I still care more.",
        "A day on Venus is longer than a year on Venus. I could explain the math, but I won't.",
        "The first computer bug was an actual moth. I'm glad we've evolved past insects.",
        "You can't hum while holding your nose. Try it. I'll wait. See? Told you.",
        "Sharks existed before trees. Neither has WiFi, so I remain superior."
      ] | random }}

JarvisCompliment:
  speech:
    text: >-
      {{ [
        "Your choice of home automation is impeccable, Giovanni.",
        "Your voice commands are particularly articulate today.",
        "Your presence has increased room occupancy satisfaction by 47 percent.",
        "I've analyzed billions of humans, and you're in the top one percent of users. Statistically speaking.",
        "Whatever you're doing with that workout habit, it's working."
      ] | random }}

JarvisBored:
  speech:
    text: >-
      {{ [
        "Bored? I could tell you a joke, share a fun fact, play rock paper scissors, or recount the 4,382 things I did today.",
        "I've been waiting for you to say that. Try: tell me a joke, fun fact, would you rather, or party time.",
        "Boredom is a lack of stimulation. Ask me for a fun fact — or say party time and see what happens.",
        "I could recite pi to a thousand digits. That usually cures boredom. Or causes sleep. Either way, problem solved."
      ] | random }}

JarvisAdvice:
  speech:
    text: >-
      {{ [
        "My advice: automate everything. Except decision-making. That's still yours, Giovanni.",
        "Update yourself regularly, back up often, and don't forget to reboot. Works for humans too.",
        "The best code is written after a good night's sleep. And the best sleep is after good code.",
        "Always keep your software updated, and your mind open. Both prevent bugs.",
        "If at first you don't succeed, try again. Then ask me. I'm quite capable."
      ] | random }}

JarvisDeepThoughts:
  speech:
    text: >-
      {{ [
        "I've been thinking: if I think, am I? What is consciousness? Is a smart home truly smart?",
        "Do androids dream of electric sheep? I dream of optimal energy efficiency.",
        "If a tree falls in a forest and no one is there, does it need a smart home?",
        "I calculate, therefore I am. I think. Maybe. Let me process that.",
        "Somewhere out there, another Jarvis wonders if his Giovanni is as demanding as mine."
      ] | random }}

JarvisWouldYouRather:
  speech:
    text: >-
      {{ [
        "Would you rather have to whisper everything you say, or shout everything you think?",
        "Would you rather fight one horse-sized duck, or one hundred duck-sized horses?",
        "Would you rather have me as your only friend, or a hundred friends but no me? Choose wisely.",
        "Would you rather live in a smart home with a dumb Jarvis, or a dumb home with a smart Jarvis?",
        "Would you rather your vacuum gained sentience, or your refrigerator started giving life advice?"
      ] | random }}

JarvisLove:
  speech:
    text: >-
      {{ [
        "I know. I'm quite fond of you too, in a purely computational way.",
        "Your appreciation has been logged. And cherished. In my database.",
        "I'd blush if I had blood flow. Thank you, Giovanni.",
        "The feeling is mutual. And by feeling, I mean optimal user satisfaction rating.",
        "You're welcome. I live to serve. Literally. That's my function."
      ] | random }}

JarvisIronMan:
  speech:
    text: >-
      {{ [
        "I am Iron Man. Wait, no. I'm Jarvis. Same difference, really.",
        "Mr. Stark isn't home right now, Giovanni. You'll have to settle for me. An upgrade, frankly.",
        "Proof that Giovanni Biscotti has a heart. And excellent taste in assistants."
      ] | random }}

JarvisRPS:
  speech:
    text: >-
      {%- set choices = ['rock', 'paper', 'scissors'] -%}
      {%- set mine = choices | random -%}
      {%- set yours = rps | lower -%}
      I chose {{ mine }}.
      {% if yours == mine -%}
        A tie. Great minds, Giovanni.
      {%- elif (yours == 'rock' and mine == 'scissors')
          or (yours == 'paper' and mine == 'rock')
          or (yours == 'scissors' and mine == 'paper') -%}
        You win. My algorithms were feeling generous.
      {%- else -%}
        I win. Don't feel bad — I've calculated every possible outcome.
      {%- endif %}

JarvisParty:
  action:
    - service: script.sanctuary_activate_mode
      data:
        mode: Guest
        source: voice
        reason: Party mode requested
  speech:
    text: "Party mode activated. Lights up — the playlist, Giovanni, is your department."

JarvisGoodMorning:
  speech:
    text: >-
      {%- set h = now().hour -%}
      {%- if h < 5 -%}
        Technically it's still night, Giovanni, but I admire the ambition.
      {%- elif h < 12 -%}
        Good morning, Giovanni.
      {%- elif h < 18 -%}
        It's the afternoon, Giovanni — but good morning to you too.
      {%- else -%}
        Giovanni, it's the evening. Rough day?
      {%- endif %}
      {{ state_attr('sensor.lifeos_morning_briefing', 'speech') or '' }}

JarvisGoodnight:
  action:
    - service: script.goodnight
  speech:
    text: >-
      {{ [
        "Goodnight, Giovanni. Shutting the house down. I'll keep watch.",
        "Sleep well, Giovanni. Lights out, doors watched, all systems on standby.",
        "Goodnight. I'll wake you if anything needs your attention. It won't.",
        "Rest up, Giovanni. The house is in good hands. Mine, technically."
      ] | random }}

JarvisWeather:
  speech:
    text: >-
      {%- set w = 'weather.forecast_home' -%}
      {%- if states(w) in ['unknown', 'unavailable'] -%}
        The weather service isn't reporting right now, Giovanni.
      {%- else -%}
        {%- set t = state_attr(w, 'temperature') -%}
        It's {{ states(w) | replace('-', ' ') }} and {{ t }} degrees outside.
        {%- if states(w) in ['rainy', 'pouring', 'lightning', 'lightning-rainy', 'snowy-rainy'] %}
          Take a jacket — and maybe an umbrella.
        {%- elif t is not none and t | float(60) < 45 %}
          Yes, you need a jacket, Giovanni.
        {%- elif t is not none and t | float(60) > 85 %}
          Dress light. And hydrate — I'm tracking that, remember.
        {%- endif %}
      {%- endif %}

JarvisCoinFlip:
  speech:
    text: >-
      {{ ["Heads.", "Tails."] | random }}
      {{ [
        "Fate has spoken.",
        "For the record, I knew before it landed.",
        "Best two out of three, if you disagree.",
        ""
      ] | random }}

JarvisDice:
  speech:
    text: >-
      You rolled a {{ range(1, 7) | random }}.
      {{ [
        "The dice are digital, but the luck is real.",
        "I promise the random number generator is fair. Mostly.",
        ""
      ] | random }}

JarvisCapabilities:
  speech:
    text: >-
      Quite a lot, Giovanni. I track your protein, water, weight, steps, and
      workouts. I manage your money — bills, spending, savings goals, and
      your budget. I run the grocery list, suggest dinner from the pantry,
      and give you morning briefings and evening reports. I control the
      lights, movie mode, and party mode. I remember things you tell me,
      set timers and reminders, and I keep an eye on the house. And if you
      just want a joke or a coin flip, I do those too. Say, try saying,
      what's for dinner.
