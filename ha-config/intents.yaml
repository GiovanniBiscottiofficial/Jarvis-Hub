# Spoken answers for the custom sentences in custom_sentences/en/lifeos.yaml.
# Answers come from LifeOS via sensor.lifeos_answers (refreshed every 2 min).

LifeOSProtein:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'protein') or 'LifeOS is not reachable right now.' }}"

LifeOSSteps:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'steps') or 'LifeOS is not reachable right now.' }}"

LifeOSBills:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'bills') or 'LifeOS is not reachable right now.' }}"

LifeOSMoney:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'money') or 'LifeOS is not reachable right now.' }}"

LifeOSMeals:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'meals') or 'LifeOS is not reachable right now.' }}"

LifeOSBriefing:
  speech:
    text: "{{ state_attr('sensor.lifeos_morning_briefing', 'speech') or 'LifeOS is not reachable right now.' }}"

LifeOSWeeklyReview:
  speech:
    text: "{{ state_attr('sensor.lifeos_weekly_review', 'speech') or 'LifeOS is not reachable right now.' }}"

# --- voice logging ---

LifeOSTakeVitamins:
  action:
    - service: rest_command.lifeos_take_vitamins
  speech:
    text: "Vitamins logged — streak's alive."

LifeOSLogProtein:
  action:
    - service: rest_command.lifeos_log_protein
      data:
        grams: "{{ grams }}"
  speech:
    text: "Logged {{ grams }} grams of protein."

LifeOSWeighIn:
  action:
    - service: rest_command.lifeos_weighin
      data:
        pounds: "{{ pounds }}"
  speech:
    text: "Weigh-in logged at {{ pounds }} pounds."

LifeOSSetSteps:
  action:
    - service: rest_command.lifeos_set_steps
      data:
        steps: "{{ steps }}"
  speech:
    text: "Steps set to {{ steps }} for today."

LifeOSTreat:
  action:
    - service: rest_command.lifeos_treat
  speech:
    text: "Treat logged — no drama. I put a 15-minute balance circuit on today's plan."

LifeOSDeposit:
  action:
    - service: rest_command.lifeos_deposit
      data:
        amount: "{{ amount }}"
        account: "{{ account }}"
  speech:
    text: "Deposit of {{ amount }} dollars logged to {{ account }} — if that account name didn't match, check the Vault tab."

LifeOSBillPaid:
  action:
    - service: rest_command.lifeos_bill_paid
      data:
        bill: "{{ bill }}"
  speech:
    text: "Marked {{ bill }} as paid this month."

LifeOSAddBill:
  action:
    - service: rest_command.lifeos_add_bill
      data:
        bill: "{{ bill }}"
        amount: "{{ amount }}"
        due_day: "{{ due_day }}"
  speech:
    text: "Added the {{ bill }} bill — {{ amount }} dollars due on the {{ due_day }}."

LifeOSAddAccount:
  action:
    - service: rest_command.lifeos_add_account
      data:
        account: "{{ account }}"
  speech:
    text: "Added {{ account }} to your accounts."

LifeOSSpend:
  action:
    - service: rest_command.lifeos_spend
      data:
        amount: "{{ amount }}"
        merchant: "{{ merchant }}"
  speech:
    text: "Spent {{ amount }} dollars{{ ' at ' + merchant if merchant else '' }} — logged."

LifeOSSpendCheck:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'spending') or 'LifeOS is not reachable right now.' }}"

LifeOSGroceryAdd:
  action:
    - service: rest_command.lifeos_grocery_add
      data:
        item: "{{ item }}"
  speech:
    text: "{{ item }} is on the grocery list."

LifeOSGroceryList:
  speech:
    text: "{{ state_attr('sensor.lifeos_answers', 'grocery') or 'LifeOS is not reachable right now.' }}"

LifeOSGroceryClear:
  action:
    - service: rest_command.lifeos_grocery_clear
  speech:
    text: "Grocery list cleared."

LifeOSLogUsual:
  action:
    - service: rest_command.lifeos_favorite_log
      data:
        slot: "{{ slot }}"
  speech:
    text: "Logged your usual {{ slot }} — if you haven't set one yet, say: set my usual {{ slot }} to, then the meal."

LifeOSSetUsual:
  action:
    - service: rest_command.lifeos_favorite_set
      data:
        slot: "{{ slot }}"
        meal: "{{ meal }}"
  speech:
    text: "Your usual {{ slot }} is now {{ meal }}."

# --- house control ---

JarvisAnnounce:
  action:
    - service: script.announce
      data:
        message: "{{ message }}"
  speech:
    text: "Announcing."
