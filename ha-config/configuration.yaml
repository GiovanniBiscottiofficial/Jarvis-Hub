# Jarvis Hub — Home Assistant configuration
# Loads defaults plus our curated automations/scripts.

default_config:

# Jarvis look — dark glass theme (see themes/jarvis.yaml)
frontend:
  themes: !include_dir_merge_named themes/

# The X1's own kiosk screen logs in automatically (no keyboard needed);
# every other device still gets the normal password login.
homeassistant:
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - ::1
        # To auto-login other screens on your home wifi too, add your
        # LAN subnet (check with: ip route | grep default):
        # - 192.168.1.0/24
      allow_bypass_login: true
    - type: homeassistant

automation: !include_dir_merge_list automations/
script: !include_dir_merge_named scripts/

# Voice Q&A — "Jarvis, how much protein do I have left?" etc.
intent_script: !include intents.yaml

# Jarvis Command Center dashboard (sidebar entry "Jarvis")
lovelace:
  mode: storage
  dashboards:
    jarvis-hub:
      mode: yaml
      title: Jarvis
      icon: mdi:robot
      show_in_sidebar: true
      filename: dashboards/jarvis.yaml
    lifeos-app:
      mode: yaml
      title: LifeOS
      icon: mdi:heart-pulse
      show_in_sidebar: true
      filename: dashboards/lifeos.yaml

# Local shopping list ("Jarvis, add milk to the shopping list")
shopping_list:

# Wake computers over the network (fill in MACs, see README Phase 17)
wake_on_lan:

# Text-to-speech fallback (Piper via Wyoming is added through the UI)
tts:
  - platform: google_translate

# Voice logging into LifeOS (called from intents.yaml).
# Add Authorization: Bearer <LIFEOS_API_TOKEN> to these requests if LifeOS auth is enabled.
rest_command:
  lifeos_take_vitamins:
    url: http://localhost:8090/api/body/vitamins/take
    method: POST
  lifeos_log_protein:
    url: http://localhost:8090/api/body/meals/log
    method: POST
    content_type: application/json
    payload: '{"name": "Voice-logged meal", "protein_g": {{ grams }}}'
  lifeos_weighin:
    url: http://localhost:8090/api/body/weighin
    method: POST
    content_type: application/json
    payload: '{"weight_lb": {{ pounds }}}'
  lifeos_set_steps:
    url: http://localhost:8090/api/body/steps
    method: POST
    content_type: application/json
    payload: '{"count": {{ steps }}}'
  lifeos_treat:
    url: http://localhost:8090/api/body/overrides
    method: POST
    content_type: application/json
    payload: '{"meal": "Voice-logged treat", "kind": "today"}'
  lifeos_deposit:
    url: http://localhost:8090/api/vault/deposits/by-name
    method: POST
    content_type: application/json
    payload: '{"amount": {{ amount }}, "account": {{ account | tojson }}}'
  lifeos_bill_paid:
    url: http://localhost:8090/api/vault/bills/paid/by-name
    method: POST
    content_type: application/json
    payload: '{"name": {{ bill | tojson }}}'
  lifeos_resolve_nudge:
    url: http://localhost:8090/api/vault/nudges/{{ nudge_id }}/resolve
    method: POST
  lifeos_add_bill:
    url: http://localhost:8090/api/vault/bills
    method: POST
    content_type: application/json
    # due_day comes in spoken ("the 15th") — strip everything but digits
    payload: '{"name": {{ bill | tojson }}, "amount": {{ amount }}, "due_day": {{ due_day | regex_replace("[^0-9]", "") | int(1) }}}'
  lifeos_add_account:
    url: http://localhost:8090/api/vault/accounts
    method: POST
    content_type: application/json
    payload: '{"name": {{ account | tojson }}}'
  lifeos_spend:
    url: http://localhost:8090/api/vault/spending
    method: POST
    content_type: application/json
    payload: '{"amount": {{ amount }}, "merchant": {{ merchant | tojson }}}'
  lifeos_grocery_add:
    url: http://localhost:8090/api/pantry/grocery
    method: POST
    content_type: application/json
    payload: '{"item": {{ item | tojson }}}'
  lifeos_grocery_remove:
    url: http://localhost:8090/api/pantry/grocery/remove
    method: POST
    content_type: application/json
    payload: '{"item": {{ item | tojson }}}'
  lifeos_grocery_clear:
    url: http://localhost:8090/api/pantry/grocery/clear
    method: POST
  lifeos_favorite_log:
    url: http://localhost:8090/api/body/favorites/{{ slot }}/log
    method: POST
  lifeos_favorite_set:
    url: http://localhost:8090/api/body/favorites/{{ slot }}
    method: PUT
    content_type: application/json
    payload: '{"meal": {{ meal | tojson }}}'
  lifeos_water:
    url: http://localhost:8090/api/body/water
    method: POST
    content_type: application/json
    payload: '{"glasses": {{ glasses | int(1) }}}'
  lifeos_remember:
    url: http://localhost:8090/api/memory
    method: POST
    content_type: application/json
    payload: '{"fact": {{ fact | tojson }}}'
  lifeos_forget:
    url: http://localhost:8090/api/memory/forget
    method: POST
  lifeos_workout:
    url: http://localhost:8090/api/body/workouts/log
    method: POST
    content_type: application/json
    payload: '{}'
  lifeos_goal_contribute:
    url: http://localhost:8090/api/vault/goals/contribute
    method: POST
    content_type: application/json
    payload: '{"name": {{ goal | tojson }}, "amount": {{ amount }}}'

# Example: SSH power commands for Mac/Linux computers (uncomment + edit)
# shell_command:
#   sleep_macbook: ssh -o StrictHostKeyChecking=no user@192.168.1.50 pmset sleepnow

# Toggles used by the guest-mode and sleep-intelligence automations
input_boolean:
  guest_mode:
    name: Guest mode
    icon: mdi:account-group
  sleep_mode:
    name: Sleep mode
    icon: mdi:sleep
  vacation_mode:
    name: Vacation mode
    icon: mdi:beach
  quiet_mode:
    name: Quiet mode
    icon: mdi:volume-off
  medication_taken:
    name: Medication taken today
    icon: mdi:pill
  circadian_lighting:
    name: Circadian lighting
    icon: mdi:theme-light-dark

# Monthly budget cap — the budget-alert automation fires when LifeOS
# month-to-date spending crosses this (adjust it from any dashboard).
input_number:
  monthly_budget:
    name: Monthly budget
    icon: mdi:cash-lock
    min: 100
    max: 10000
    step: 50
    initial: 2000
    unit_of_measurement: "$"
    mode: box

# LifeOS speech feeds — Jarvis reads these aloud (see automations/briefing.yaml)
rest:
  - resource: http://localhost:8090/api/briefing
    scan_interval: 900
    sensor:
      - name: LifeOS morning briefing
        value_template: "{{ value_json.date }}"
        json_attributes: [speech, leftover_after_bills, vitamins_taken]
  - resource: http://localhost:8090/api/review/weekly
    scan_interval: 3600
    sensor:
      - name: LifeOS weekly review
        value_template: "{{ value_json.period_start }}"
        json_attributes: [speech, avg_daily_protein_g, treats_this_week]
  # Ready-to-speak answers for the voice intents in intents.yaml
  - resource: http://localhost:8090/api/ask
    scan_interval: 120
    sensor:
      - name: LifeOS answers
        value_template: "{{ now().isoformat() }}"
        json_attributes: [protein, steps, bills, money, meals, spending, grocery, water, water_count, water_target, goals, memory, dinner, evening, nudge, nudge_id, budget, paycheck, networth, safe_to_spend, audit_health]
  # Month-to-date spending from the LifeOS ledger (voice-logged spends)
  - resource: http://localhost:8090/api/vault/spending
    scan_interval: 900
    sensor:
      - name: LifeOS monthly spending
        unit_of_measurement: "$"
        value_template: "{{ value_json.month_total | round(2) }}"
        json_attributes: [week_total]
  # Semi-monthly budget command center (paycheck allocation + audit)
  - resource: http://localhost:8090/api/budget/overview
    scan_interval: 300
    sensor:
      - name: LifeOS safe to spend
        unit_of_measurement: "$"
        value_template: "{{ value_json.safe_to_spend | round(2) }}"
        json_attributes: [audit, audit_note, allocated, unpaid_total, ecosystem_cash, total_debt, net_worth, period]

# The X1's built-in UPS: reads the laptop's own AC-adapter and battery
# state from the kernel, so a power outage is detected the second the
# adapter drops (see automations/power.yaml).
command_line:
  - binary_sensor:
      name: Mains power
      unique_id: x1_mains_power
      command: "head -qn1 /sys/class/power_supply/A*/online 2>/dev/null || echo 1"
      payload_on: "1"
      payload_off: "0"
      device_class: power
      scan_interval: 30
  - sensor:
      name: X1 battery
      unique_id: x1_battery
      command: "head -qn1 /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 100"
      unit_of_measurement: "%"
      device_class: battery
      scan_interval: 60
  # Hottest thermal zone on the X1 (CPU package) — feeds the overheat alert
  # in automations/power.yaml and the diagnostic script.
  - sensor:
      name: X1 CPU temperature
      unique_id: x1_cpu_temp
      command: "cat /sys/class/thermal/thermal_zone*/temp 2>/dev/null | sort -n | tail -1 || echo 0"
      unit_of_measurement: "°C"
      device_class: temperature
      value_template: "{{ (value | int(0) / 1000) | round(1) }}"
      scan_interval: 60

# Contextual awareness: what's happening in the house right now.
# Works with the Fire TV out of the box; the "working" branch lights up
# once a desk-chair pressure mat or PC sensor is added.
template:
  - binary_sensor:
      # Giovanni works Mon-Fri, 8 AM - 5 PM. Automations use this to avoid
      # announcing to an empty house and to time evening routines.
      - name: Giovanni work hours
        unique_id: giovanni_work_hours
        icon: mdi:briefcase-clock
        state: >-
          {{ now().weekday() < 5 and 8 <= now().hour < 17 }}
  - sensor:
      - name: Current activity
        unique_id: jarvis_current_activity
        icon: mdi:motion
        state: >-
          {% if is_state('media_player.fire_tv', 'playing') %}
            watching_tv
          {% elif is_state('binary_sensor.desk_chair', 'on') %}
            working
          {% elif is_state('input_boolean.sleep_mode', 'on') %}
            sleeping
          {% else %}
            idle
          {% endif %}
      - name: Room atmosphere
        unique_id: jarvis_room_atmosphere
        icon: mdi:home-heart
        state: >-
          {% set tv = is_state('media_player.fire_tv', 'playing') %}
          {% set lights = is_state('light.living_room', 'on') %}
          {% if is_state('input_boolean.sleep_mode', 'on') %}
            sleeping
          {% elif tv and lights %}
            movie_time
          {% elif tv and not lights %}
            relaxing
          {% elif is_state('input_boolean.guest_mode', 'on') and lights %}
            party
          {% else %}
            normal
          {% endif %}

# Behavior learning + predictive maintenance (history_stats turns entity
# history into hours-per-day numbers).
# EDIT: climate.thermostat / binary_sensor.bedroom_motion to your entities.
sensor:
  - platform: history_stats
    name: HVAC runtime hours
    entity_id: climate.thermostat
    state: "heat"
    type: time
    start: "{{ now() - timedelta(days=90) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Bedroom activity today
    entity_id: binary_sensor.bedroom_motion
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"

