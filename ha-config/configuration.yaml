# Jarvis Hub — Home Assistant configuration
# Loads defaults plus our curated automations/scripts.

default_config:

automation: !include_dir_merge_list automations/
script: !include_dir_merge_named scripts/

# Voice Q&A — "Jarvis, how much protein do I have left?" etc.
intent_script: !include intents.yaml

# Jarvis Command Center dashboard (sidebar entry "Jarvis")
lovelace:
  mode: storage
  dashboards:
    jarvis-hub:
      mode: yaml
      title: Jarvis
      icon: mdi:robot
      show_in_sidebar: true
      filename: dashboards/jarvis.yaml

# Local shopping list ("Jarvis, add milk to the shopping list")
shopping_list:

# Wake computers over the network (fill in MACs, see README Phase 17)
wake_on_lan:

# Text-to-speech fallback (Piper via Wyoming is added through the UI)
tts:
  - platform: google_translate

# Example: SSH power commands for Mac/Linux computers (uncomment + edit)
# shell_command:
#   sleep_macbook: ssh -o StrictHostKeyChecking=no user@192.168.1.50 pmset sleepnow

# Toggles used by the guest-mode and sleep-intelligence automations
input_boolean:
  guest_mode:
    name: Guest mode
    icon: mdi:account-group
  sleep_mode:
    name: Sleep mode
    icon: mdi:sleep

# LifeOS speech feeds — Jarvis reads these aloud (see automations/briefing.yaml)
rest:
  - resource: http://localhost:8090/api/briefing
    scan_interval: 900
    sensor:
      - name: LifeOS morning briefing
        value_template: "{{ value_json.date }}"
        json_attributes: [speech, leftover_after_bills, vitamins_taken]
  - resource: http://localhost:8090/api/review/weekly
    scan_interval: 3600
    sensor:
      - name: LifeOS weekly review
        value_template: "{{ value_json.period_start }}"
        json_attributes: [speech, avg_daily_protein_g, treats_this_week]
  # Ready-to-speak answers for the voice intents in intents.yaml
  - resource: http://localhost:8090/api/ask
    scan_interval: 120
    sensor:
      - name: LifeOS answers
        value_template: "{{ now().isoformat() }}"
        json_attributes: [protein, steps, bills, money, meals]

# Energy tracking: point these at smart-plug power sensors once you have them
# (each plug exposes sensor.<plug>_energy). utility_meter turns kWh into
# daily/monthly totals for the dashboard.
