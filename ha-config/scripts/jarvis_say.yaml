# Jarvis's voice. Output priority:
#   1. The X1 voice satellite (its own laptop speakers) — appears as an
#      assist_satellite entity once Phase 3 + setup-satellite.sh are done.
#   2. Piper TTS to a real media player (e.g. a paired smart speaker).
#   3. Google Translate TTS to that media player (pre-Piper fallback).
# If no audio device exists yet, announcements are skipped silently —
# phone notifications still arrive.
jarvis_say:
  alias: "Jarvis says"
  icon: mdi:account-voice
  mode: queued
  max: 5
  fields:
    message:
      description: "What Jarvis should say"
      example: "Dinner's ready"
    urgent:
      description: "Speak even in quiet mode (emergencies)"
      example: "true"
  sequence:
    # Quiet mode (auto-on during movies) silences everything but emergencies
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.quiet_mode
          state: "off"
        - condition: template
          value_template: "{{ urgent | default(false) }}"
    - variables:
        satellite: >-
          {{ states.assist_satellite | map(attribute='entity_id')
             | list | first | default('') }}
        piper_tts: >-
          {{ states.tts | map(attribute='entity_id')
             | select('search', 'piper') | list | first | default('') }}
        speaker: >-
          {{ states.media_player
             | rejectattr('state', 'in', ['unknown', 'unavailable'])
             | map(attribute='entity_id') | list | first | default('') }}
    - choose:
        - conditions: "{{ satellite != '' }}"
          sequence:
            - service: assist_satellite.announce
              target:
                entity_id: "{{ satellite }}"
              data:
                message: "{{ message }}"
        - conditions: "{{ piper_tts != '' and speaker != '' }}"
          sequence:
            - service: tts.speak
              target:
                entity_id: "{{ piper_tts }}"
              data:
                media_player_entity_id: "{{ speaker }}"
                message: "{{ message }}"
        - conditions: "{{ speaker != '' }}"
          sequence:
            - service: tts.google_translate_say
              data:
                entity_id: "{{ speaker }}"
                message: "{{ message }}"
