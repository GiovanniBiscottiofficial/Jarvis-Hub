# Jarvis's voice. Output priority:
#   1. The X1 voice satellite (its own laptop speakers) — appears as an
#      assist_satellite entity once Phase 3 + setup-satellite.sh are done.
#   2. Piper TTS to a real media player (e.g. a paired smart speaker).
#   3. Google Translate TTS to that media player (pre-Piper fallback).
# If no audio device exists yet, announcements are skipped silently —
# phone notifications still arrive.
jarvis_say:
  alias: "Jarvis says"
  icon: mdi:account-voice
  mode: queued
  max: 5
  fields:
    message:
      description: "What Jarvis should say"
      example: "Dinner's ready"
    urgent:
      description: "Speak even in quiet mode (emergencies)"
      example: "true"
      default: false
      selector:
        boolean:
    preannounce:
      description: "Play the attention tone first; emergencies always do"
      example: "false"
      default: false
      selector:
        boolean:
    listen_after:
      description: "Keep the local microphone open for a contextual follow-up"
      example: "true"
      default: false
      selector:
        boolean:
  sequence:
    # Quiet mode (auto-on during movies) silences everything but emergencies
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.quiet_mode
          state: "off"
        - condition: template
          value_template: "{{ urgent | default(false) }}"
    - variables:
        # Keep spoken copy natural and enforce Giovanni's address policy even
        # when upstream text came from an integration or generated response.
        spoken_message: >-
          {{ message | string
             | regex_replace('(?i)\\bsir\\b', 'Giovanni')
             | regex_replace('(?i)\\bLifeOS\\b', 'Life O S')
             | regex_replace('\\bX1\\b', 'X one')
             | regex_replace('\\bP1\\b', 'paycheck one')
             | regex_replace('\\bP2\\b', 'paycheck two')
             | regex_replace('\\s+', ' ')
             | trim }}
        x1_satellite: >-
          {{ 'assist_satellite.jarvis_x1_assist_satellite'
             if states('assist_satellite.jarvis_x1_assist_satellite')
                not in ['unknown', 'unavailable']
             else ('assist_satellite.x1'
               if states('assist_satellite.x1') not in ['unknown', 'unavailable']
               else '') }}
        satellite: >-
          {{ x1_satellite if x1_satellite != '' else
             (states.assist_satellite
                | rejectattr('state', 'in', ['unknown', 'unavailable'])
                | map(attribute='entity_id') | list | first | default('')) }}
        supports_conversation: >-
          {{ satellite != '' and
             (((state_attr(satellite, 'supported_features') | int(0)) // 2) % 2 == 1) }}
        piper_tts: >-
          {{ states.tts | map(attribute='entity_id')
             | select('search', 'piper') | list | first | default('') }}
        speaker: >-
          {{ states.media_player
             | rejectattr('state', 'in', ['unknown', 'unavailable'])
             | map(attribute='entity_id') | list | first | default('') }}
    - choose:
        - conditions: >-
            {{ satellite != '' and listen_after | default(false)
               and supports_conversation }}
          sequence:
            - service: assist_satellite.start_conversation
              target:
                entity_id: "{{ satellite }}"
              data:
                start_message: "{{ spoken_message }}"
                extra_system_prompt: >-
                  Giovanni has just heard a grounded LifeOS briefing. Treat his
                  next short reply as a follow-up to that briefing. Use the most
                  recent topic and ask before any risky or irreversible action.
                preannounce: >-
                  {{ true if urgent | default(false) else preannounce | default(false) }}
        - conditions: "{{ satellite != '' }}"
          sequence:
            - service: assist_satellite.announce
              target:
                entity_id: "{{ satellite }}"
              data:
                message: "{{ spoken_message }}"
                preannounce: >-
                  {{ true if urgent | default(false) else preannounce | default(false) }}
        - conditions: "{{ piper_tts != '' and speaker != '' }}"
          sequence:
            - service: tts.speak
              target:
                entity_id: "{{ piper_tts }}"
              data:
                media_player_entity_id: "{{ speaker }}"
                message: "{{ spoken_message }}"
        - conditions: "{{ speaker != '' }}"
          sequence:
            - service: tts.google_translate_say
              data:
                entity_id: "{{ speaker }}"
                message: "{{ spoken_message }}"
