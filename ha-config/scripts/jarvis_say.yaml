# Jarvis's voice. Prefers Piper (his real local voice, added via the
# Wyoming integration in Phase 3) and falls back to Google Translate TTS
# until Piper is set up — so every announcement automatically upgrades
# the moment voice is configured.
jarvis_say:
  alias: "Jarvis says"
  icon: mdi:account-voice
  mode: queued
  max: 5
  fields:
    message:
      description: "What Jarvis should say"
      example: "Dinner's ready"
    urgent:
      description: "Speak even in quiet mode (emergencies)"
      example: "true"
  sequence:
    # Quiet mode (auto-on during movies) silences everything but emergencies
    - condition: or
      conditions:
        - condition: state
          entity_id: input_boolean.quiet_mode
          state: "off"
        - condition: template
          value_template: "{{ urgent | default(false) }}"
    - variables:
        piper_tts: >-
          {{ states.tts | map(attribute='entity_id')
             | select('search', 'piper') | list | first | default('') }}
    - choose:
        - conditions: "{{ piper_tts != '' }}"
          sequence:
            - service: tts.speak
              target:
                entity_id: "{{ piper_tts }}"
              data:
                media_player_entity_id: media_player.living_room_speaker
                message: "{{ message }}"
      default:
        - service: tts.google_translate_say
          data:
            entity_id: media_player.living_room_speaker
            message: "{{ message }}"
