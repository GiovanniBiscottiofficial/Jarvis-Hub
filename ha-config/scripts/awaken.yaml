# "Hey Jarvis, wake up" — full system awakening: ambient cyan glow,
# spoken greeting, and a status report to your phone. The X1 kiosk shows
# the animated boot splash on its own at startup; this is the on-demand
# showpiece version.
full_jarvis_awakening:
  alias: "Full Jarvis awakening"
  icon: mdi:robot-excited
  sequence:
    - service: script.sanctuary_activate_mode
      data:
        mode: Morning
        source: voice
        reason: Full Jarvis awakening requested
    # Audio greeting
    - service: script.jarvis_say
      data:
        message: >-
          All systems initialized. Welcome back, sir.
          {{ state_attr('sensor.lifeos_answers', 'nudge')
             or 'Everything is running smoothly.' }}
    # Status report to the phone
    - service: notify.jarvis_phone
      data:
        title: "Jarvis Online"
        message: >-
          Power: {{ 'mains' if is_state('binary_sensor.mains_power', 'on')
                    else 'battery (' ~ states('sensor.x1_battery') ~ '%)' }}
          · Modes: guest {{ states('input_boolean.guest_mode') }},
          sleep {{ states('input_boolean.sleep_mode') }},
          vacation {{ states('input_boolean.vacation_mode') }}
          · {{ state_attr('sensor.lifeos_answers', 'bills')
               or 'LifeOS offline.' }}
