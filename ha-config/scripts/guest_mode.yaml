# Guest mode: friendly house, private data hidden.
# While input_boolean.guest_mode is on, use it as a condition in any
# automation you don't want firing around guests (announcements, briefings).
guest_mode_on:
  alias: "Guest mode on"
  icon: mdi:account-group
  sequence:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.guest_mode
    - service: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 80
    - service: script.jarvis_say
      data:
        message: "Guest mode is on. Personal announcements are paused."

guest_mode_off:
  alias: "Guest mode off"
  icon: mdi:account-off
  sequence:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.guest_mode
