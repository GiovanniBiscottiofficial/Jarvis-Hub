# "Jarvis, goodnight" — enter the governed Thunderstorm state. Because this is
# an explicit voice request, it may intentionally launch the approved Fire TV
# storm video; scheduled transitions continue to protect existing playback.
goodnight:
  alias: "Goodnight"
  sequence:
    - service: script.sanctuary_activate_mode
      data:
        mode: Thunderstorm
        source: voice
        reason: Goodnight requested by Giovanni
    - service: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.sleep_mode
          - input_boolean.quiet_mode
