# "Jarvis, goodnight" — enter the governed Thunderstorm state. Media is
# deliberately independent so watching or listening is never interrupted.
goodnight:
  alias: "Goodnight"
  sequence:
    - service: script.sanctuary_activate_mode
      data:
        mode: Thunderstorm
        source: voice
        reason: Goodnight requested by Giovanni
    - service: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.sleep_mode
          - input_boolean.quiet_mode
