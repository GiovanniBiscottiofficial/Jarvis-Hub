# "Jarvis, tell everyone dinner's ready" — whole-house announcement.
# EDIT: point at your real speaker. When you have several rooms, make a
# media_player group (Settings -> Devices & Services -> Helpers -> Group)
# and use that entity here so every speaker announces at once.
announce:
  alias: "Announce to the house"
  icon: mdi:bullhorn
  fields:
    message:
      description: "What Jarvis should say"
      example: "Dinner's ready"
  sequence:
    - service: tts.google_translate_say
      data:
        entity_id: media_player.living_room_speaker
        message: "{{ message }}"
