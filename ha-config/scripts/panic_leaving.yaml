# "Jarvis, I'm leaving" / one NFC-tag tap at the door. Only commissioned
# lighting is controlled; absent media, vacuum, and locks stay readiness facts.
leaving:
  alias: "Leaving (panic button)"
  icon: mdi:exit-run
  sequence:
    - service: script.sanctuary_activate_mode
      data:
        mode: Away
        source: voice
        reason: Leaving mode manually confirmed
    # Lock every computer (uncomment as machines get HASS.Agent, Phase 17)
    # - service: button.press
    #   target:
    #     entity_id: button.desktop_lock
    - service: notify.jarvis_phone
      data:
        title: "House secured"
        message: "Commissioned lights are off. Uncommissioned devices were not called."
