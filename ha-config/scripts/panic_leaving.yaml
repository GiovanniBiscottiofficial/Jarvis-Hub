# "Jarvis, I'm leaving" / one NFC-tag tap at the door.
# Locks computers (HASS.Agent buttons), kills lights/TV, sends the vacuum
# home, and flags the house as away. Add camera arming when Frigate lands.
leaving:
  alias: "Leaving (panic button)"
  icon: mdi:exit-run
  sequence:
    - service: light.turn_off
      target:
        entity_id: all
    - service: media_player.turn_off
      target:
        entity_id: media_player.fire_tv
    - service: vacuum.return_to_base
      target:
        entity_id: vacuum.juno
    # Lock every computer (uncomment as machines get HASS.Agent, Phase 17)
    # - service: button.press
    #   target:
    #     entity_id: button.desktop_lock
    - service: notify.mobile_app_phone
      data:
        title: "House secured"
        message: "Lights off, TV off, vacuum heading home."
