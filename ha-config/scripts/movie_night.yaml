# "Jarvis, movie night" — the full cinema experience: Fire TV on Netflix,
# main lights out, a low red ambient glow, a Jarvis send-off, then even
# the glow fades once the movie's rolling.
# EDIT: entity IDs (light.ambient = any lamp/LED strip behind the TV).
movie_night:
  alias: "Movie night"
  sequence:
    - service: media_player.turn_on
      target:
        entity_id: media_player.fire_tv
    - service: media_player.select_source
      target:
        entity_id: media_player.fire_tv
      data:
        source: "Netflix"
    - service: light.turn_off
      target:
        entity_id: light.living_room
    - service: light.turn_on
      target:
        entity_id: light.ambient
      data:
        rgb_color: [180, 0, 20]
        brightness: 20
    - service: script.jarvis_say
      data:
        message: "Enjoy the movie. I've set the ambiance."
    # Fade the last glow out once you're settled in
    - delay: "00:00:30"
    - service: light.turn_off
      target:
        entity_id: light.ambient
      data:
        transition: 10
