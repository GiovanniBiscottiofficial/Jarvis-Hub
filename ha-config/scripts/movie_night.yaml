# "Jarvis, movie night" — lighting remains independently functional even
# before a media player is commissioned.
movie_night:
  alias: "Movie night"
  sequence:
    - service: script.sanctuary_activate_mode
      data:
        mode: Cinema
        source: voice
        reason: Movie night requested
    - service: script.jarvis_say
      data:
        message: >-
          Cinema lighting is ready. Media control will appear automatically
          when a player is commissioned.
