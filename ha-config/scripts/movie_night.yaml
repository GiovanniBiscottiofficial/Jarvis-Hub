# "Jarvis, movie night" — one command: Fire TV on Netflix + lights to 15%.
# EDIT: entity IDs. Expose this script to Assist so it's voice-callable.
movie_night:
  alias: "Movie night"
  sequence:
    - service: media_player.turn_on
      target:
        entity_id: media_player.fire_tv
    - service: media_player.select_source
      target:
        entity_id: media_player.fire_tv
      data:
        source: "Netflix"
    - service: light.turn_on
      target:
        entity_id: light.living_room
      data:
        brightness_pct: 15
        kelvin: 2700
