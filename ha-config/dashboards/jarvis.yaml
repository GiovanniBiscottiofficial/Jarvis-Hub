# Jarvis Command Center dashboard — dark glass hub look (theme: Jarvis)
# EDIT: rename placeholder entity IDs to match your devices
# (Settings -> Devices & Services -> Entities shows the real IDs).
title: Jarvis
views:
  # ------------------------------------------------------------------
  # Wall Panel — what the X1's own screen shows in kiosk mode
  # (bootstrap/setup-kiosk.sh points Chromium here).
  - title: Wall
    path: wall
    icon: mdi:tablet-dashboard
    theme: Jarvis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            text_only: true
            content: |
              <font size="7">**{{ now().strftime('%-I:%M %p') }}**</font>

              ### {{ now().strftime('%A, %B %-d') }}
          - type: markdown
            text_only: true
            content: >
              {% set hour = now().hour %}
              {% if hour < 12 %}
              <font color="#00e5ff">**Good morning, sir.** Coffee?</font>
              {% elif hour < 18 %}
              <font color="#00e5ff">**Good afternoon, sir.** At your service.</font>
              {% else %}
              <font color="#00e5ff">**Good evening, sir.** Shall I prepare for movie night?</font>
              {% endif %}
          - type: markdown
            title: Briefing
            content: >
              {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
                 or 'LifeOS not reachable — is the lifeos container up?' }}
          - type: tile
            entity: input_boolean.sleep_mode
            name: Sleep
            icon: mdi:sleep
            color: indigo
            tap_action:
              action: toggle
          - type: tile
            entity: input_boolean.vacation_mode
            name: Vacation
            icon: mdi:beach
            color: teal
            tap_action:
              action: toggle
          - type: iframe
            url: /local/jarvis-avatar.html
            aspect_ratio: 75%
          - type: markdown
            title: Try saying…
            content: |
              • "Hey Jarvis, brief me"
              • "Hey Jarvis, movie night"
              • "Hey Jarvis, goodnight"
              • "Hey Jarvis, is the house ready for the night?"
              • "Hey Jarvis, log a glass of water"
              • "Hey Jarvis, add 50 to my vacation fund"
              • "Hey Jarvis, set a timer for 10 minutes"
              • "Hey Jarvis, add milk to the grocery list"

      - type: grid
        cards:
          - type: heading
            heading: Lights
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.living_room
            name: Living Room
            color: amber
            features:
              - type: light-brightness
          - type: tile
            entity: light.bedroom
            name: Bedroom
            color: amber
            features:
              - type: light-brightness
          - type: heading
            heading: Scenes
            icon: mdi:palette
          - type: tile
            entity: script.movie_night
            name: Movie Night
            icon: mdi:movie-open
            color: purple
            tap_action:
              action: call-service
              service: script.movie_night
          - type: tile
            entity: script.goodnight
            name: Goodnight
            icon: mdi:weather-night
            color: indigo
            tap_action:
              action: call-service
              service: script.goodnight
          - type: tile
            entity: script.leaving
            name: Leaving
            icon: mdi:exit-run
            color: red
            tap_action:
              action: call-service
              service: script.leaving
          - type: tile
            entity: input_boolean.guest_mode
            name: Guests
            icon: mdi:account-group
            color: green
            tap_action:
              action: toggle
          - type: heading
            heading: Juno
            icon: mdi:robot-vacuum
          - type: tile
            entity: vacuum.juno
            name: Vacuum
            color: cyan
            features:
              - type: vacuum-commands
                commands:
                  - start_pause
                  - return_home
                  - locate

      - type: grid
        cards:
          - type: heading
            heading: Shopping
            icon: mdi:cart-outline
          - type: todo-list
            entity: todo.shopping_list
          - type: heading
            heading: Jarvis activity
            icon: mdi:robot
          # His recent actions at a glance. Full transcripts of what he
          # heard live in Settings -> Voice assistants -> Debug.
          - type: logbook
            hours_to_show: 12
            entities:
              - light.living_room
              - light.bedroom
              - vacuum.juno
              - script.movie_night
              - script.goodnight
              - script.leaving
              - script.announce
              - input_boolean.guest_mode
              - input_boolean.sleep_mode
              - input_boolean.vacation_mode

      # Optional: full-screen "JARVIS initializing" splash overlay.
      # Needs the HACS "button-card" custom card (HACS -> Frontend ->
      # search "button-card" -> Download, then reload). Uncomment after
      # installing, and add an input_boolean called show_splash.
      # - type: conditional
      #   conditions:
      #     - entity: input_boolean.show_splash
      #       state: "on"
      #   card:
      #     type: custom:button-card
      #     styles:
      #       card:
      #         - position: fixed
      #         - top: "0"
      #         - left: "0"
      #         - width: 100vw
      #         - height: 100vh
      #         - z-index: "999"
      #         - background: radial-gradient(circle, #0a1628 0%, #000000 100%)
      #         - font-size: 2em
      #         - color: "#00e5ff"
      #     name: |
      #       [[[ return 'JARVIS — initializing systems…'; ]]]
      #     tap_action:
      #       action: call-service
      #       service: input_boolean.turn_off
      #       target:
      #         entity_id: input_boolean.show_splash

  # ------------------------------------------------------------------
  # Wall+ — the upgraded touch-first wall display. Needs three free HACS
  # frontend cards (HACS -> Frontend -> search -> Download -> reload):
  #   1. "Bubble Card"      2. "Mushroom"      3. "mini-graph-card"
  # Until they're installed this tab shows red "custom element" boxes —
  # the classic Wall tab keeps working regardless. Once you like Wall+,
  # point the kiosk at it:
  #   KIOSK_URL="http://localhost:8123/local/jarvis-splash.html?next=/jarvis-hub/wall-plus" \
  #     bash bootstrap/setup-kiosk.sh
  - title: Wall+
    path: wall-plus
    icon: mdi:monitor-star
    theme: Jarvis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            text_only: true
            content: |
              <font size="7">**{{ now().strftime('%-I:%M %p') }}**</font>

              ### {{ now().strftime('%A, %B %-d') }}
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:home-heart
                icon_color: cyan
                content: >-
                  {{ states('sensor.room_atmosphere') | replace('_', ' ') | title }}
              - type: template
                icon: mdi:briefcase-clock
                icon_color: >-
                  {{ 'amber' if is_state('binary_sensor.giovanni_work_hours', 'on') else 'cyan' }}
                content: >-
                  {{ 'At work' if is_state('binary_sensor.giovanni_work_hours', 'on') else 'Off the clock' }}
              - type: entity
                entity: sensor.x1_battery
                icon_color: green
              - type: entity
                entity: sensor.x1_cpu_temperature
                icon_color: orange
              - type: template
                icon: mdi:sleep
                icon_color: >-
                  {{ 'indigo' if is_state('input_boolean.sleep_mode', 'on') else 'disabled' }}
                content: >-
                  {{ 'Sleep' if is_state('input_boolean.sleep_mode', 'on') else '' }}
                tap_action:
                  action: call-service
                  service: input_boolean.toggle
                  target:
                    entity_id: input_boolean.sleep_mode
          - type: iframe
            url: /local/jarvis-avatar.html
            aspect_ratio: 70%
          - type: markdown
            title: Briefing
            content: >
              {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
                 or 'LifeOS not reachable — is the lifeos container up?' }}

      - type: grid
        cards:
          - type: heading
            heading: Rooms
            icon: mdi:sofa
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.living_room
            name: Living Room
            icon: mdi:sofa
            show_state: true
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.bedroom
            name: Bedroom
            icon: mdi:bed
            show_state: true
          - type: heading
            heading: Scenes
            icon: mdi:palette
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Movie Night
            icon: mdi:movie-open
            tap_action:
              action: call-service
              service: script.movie_night
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Goodnight
            icon: mdi:weather-night
            tap_action:
              action: call-service
              service: script.goodnight
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Leaving
            icon: mdi:exit-run
            tap_action:
              action: call-service
              service: script.leaving
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: input_boolean.guest_mode
            name: Guests
            icon: mdi:account-group
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: vacuum.juno
            name: Juno
            icon: mdi:robot-vacuum
            tap_action:
              action: call-service
              service: vacuum.start
              target:
                entity_id: vacuum.juno

      - type: grid
        cards:
          - type: heading
            heading: Hub vitals
            icon: mdi:pulse
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.x1_cpu_temperature
                name: CPU °C
            hours_to_show: 12
            points_per_hour: 4
            line_color: "#00e5ff"
            line_width: 3
            animate: true
            show:
              fill: fade
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.x1_battery
                name: Battery %
            hours_to_show: 24
            points_per_hour: 2
            line_color: "#4ade80"
            line_width: 3
            animate: true
            lower_bound: 0
            upper_bound: 100
            show:
              fill: fade
          - type: heading
            heading: Shopping
            icon: mdi:cart-outline
          - type: todo-list
            entity: todo.shopping_list

  # ------------------------------------------------------------------
  - title: Home
    path: home
    icon: mdi:home-assistant
    theme: Jarvis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Who's home
            icon: mdi:account-check
          - type: tile
            entity: person.keona
          - type: heading
            heading: Briefing
            icon: mdi:weather-sunset-up
          - type: markdown
            content: >
              {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
                 or 'LifeOS not reachable — is the lifeos container up?' }}

              LifeOS lives at `http://<hub-ip>:8090` — add it to your
              phone's home screen.

      - type: grid
        cards:
          - type: heading
            heading: Lights
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.living_room
            name: Living Room
            color: amber
            features:
              - type: light-brightness
          - type: tile
            entity: light.bedroom
            name: Bedroom
            color: amber
            features:
              - type: light-brightness

      - type: grid
        cards:
          - type: heading
            heading: Quick actions
            icon: mdi:gesture-tap-button
          - type: tile
            entity: script.movie_night
            name: Movie Night
            icon: mdi:movie-open
            color: purple
            tap_action:
              action: call-service
              service: script.movie_night
          - type: tile
            entity: script.goodnight
            name: Goodnight
            icon: mdi:weather-night
            color: indigo
            tap_action:
              action: call-service
              service: script.goodnight
          - type: tile
            entity: script.leaving
            name: Leaving
            icon: mdi:exit-run
            color: red
            tap_action:
              action: call-service
              service: script.leaving
          - type: tile
            entity: input_boolean.guest_mode
            name: Guest mode
            icon: mdi:account-group
            color: green
            tap_action:
              action: toggle
          - type: tile
            entity: input_boolean.vacation_mode
            name: Vacation
            icon: mdi:beach
            color: teal
            tap_action:
              action: toggle

  # ------------------------------------------------------------------
  - title: Vacuum
    path: vacuum
    icon: mdi:robot-vacuum
    theme: Jarvis
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Juno
            icon: mdi:robot-vacuum
          - type: tile
            entity: vacuum.juno
            name: Juno
            color: cyan
            features:
              - type: vacuum-commands
                commands:
                  - start_pause
                  - stop
                  - return_home
                  - locate
      - type: grid
        cards:
          - type: heading
            heading: Cleaning history
            icon: mdi:history
          - type: history-graph
            hours_to_show: 168
            entities:
              - vacuum.juno

  # ------------------------------------------------------------------
  - title: Media
    path: media
    icon: mdi:television
    theme: Jarvis
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Fire TV
            icon: mdi:television
          - type: media-control
            entity: media_player.fire_tv
          - type: tile
            entity: script.movie_night
            name: "Movie Night (Netflix + dim lights)"
            icon: mdi:movie-open
            color: purple
            tap_action:
              action: call-service
              service: script.movie_night
      - type: grid
        cards:
          - type: heading
            heading: Quick launch
            icon: mdi:rocket-launch
          - type: tile
            entity: sun.sun
            name: Netflix
            icon: mdi:netflix
            color: red
            hide_state: true
            tap_action:
              action: url
              url_path: "https://netflix.com"
          - type: tile
            entity: sun.sun
            name: YouTube
            icon: mdi:youtube
            color: red
            hide_state: true
            tap_action:
              action: url
              url_path: "https://youtube.com"
          - type: tile
            entity: sun.sun
            name: Spotify
            icon: mdi:spotify
            color: green
            hide_state: true
            tap_action:
              action: url
              url_path: "https://open.spotify.com"
          - type: tile
            entity: sun.sun
            name: GeForce Now
            icon: mdi:gamepad-variant
            color: purple
            hide_state: true
            tap_action:
              action: url
              url_path: "https://play.geforcenow.com"
          - type: tile
            entity: sun.sun
            name: Plex / Jellyfin
            icon: mdi:play-network
            color: amber
            hide_state: true
            tap_action:
              action: url
              url_path: "https://app.plex.tv"
          # Once the Plex or Jellyfin integration is added, drop a real
          # media-control card here for its player:
          # - type: media-control
          #   entity: media_player.plex_x1

  # ------------------------------------------------------------------
  - title: Kitchen
    path: kitchen
    icon: mdi:fridge
    theme: Jarvis
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Shopping list
            icon: mdi:cart-outline
          - type: todo-list
            entity: todo.shopping_list
      - type: grid
        cards:
          - type: heading
            heading: Grocy
            icon: mdi:food-apple
          - type: markdown
            content: >
              **Grocy** (full inventory + expiry tracking) lives at
              `http://<hub-ip>:9283` once you run
              `docker compose --profile grocy up -d`.

  # ------------------------------------------------------------------
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    theme: Jarvis
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Cameras
            icon: mdi:cctv
          - type: markdown
            content: >
              **No cameras yet.** When you get one: put its RTSP URL in
              `frigate/config.yml`, run `docker compose --profile cameras up -d`,
              install the **Frigate** integration via HACS, then replace this
              card with `picture-glance` cards for each camera. You'll be able
              to check them from work through Tailscale + the Companion app.
          # - type: picture-glance
          #   title: Front door
          #   camera_image: camera.front_door
          #   camera_view: live
          #   entities:
          #     - binary_sensor.front_door_person_occupancy

  # ------------------------------------------------------------------
  # Digital twin: live "what is the house doing" view. The floorplan card
  # lights up once you drop a floorplan image at ha-config/www/floorplan.png
  # and uncomment the picture-elements block below.
  - title: Twin
    path: twin
    icon: mdi:home-analytics
    theme: Jarvis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: House state
            icon: mdi:home-analytics
          - type: tile
            entity: sensor.current_activity
            name: Activity
            icon: mdi:motion
            color: cyan
          - type: tile
            entity: input_boolean.quiet_mode
            name: Quiet mode
            color: cyan
          - type: tile
            entity: input_boolean.sleep_mode
            name: Sleep mode
            color: cyan
          - type: tile
            entity: input_boolean.guest_mode
            name: Guest mode
            color: cyan
          - type: tile
            entity: input_boolean.vacation_mode
            name: Vacation
            color: cyan
      - type: grid
        cards:
          - type: heading
            heading: Power flow
            icon: mdi:lightning-bolt
          - type: tile
            entity: binary_sensor.mains_power
            name: Mains
            color: cyan
          - type: tile
            entity: sensor.x1_battery
            name: Hub battery
            color: cyan
          - type: history-graph
            hours_to_show: 24
            entities:
              - sensor.x1_battery
      - type: grid
        cards:
          - type: heading
            heading: Floorplan
            icon: mdi:floor-plan
          - type: markdown
            content: >
              Drop a floorplan image at `ha-config/www/floorplan.png`
              (draw one free at floorplanner.com or sweethome3d.com),
              then replace this card with the picture-elements block
              commented in the YAML — tap rooms to control lights.
          # - type: picture-elements
          #   image: /local/floorplan.png
          #   elements:
          #     - type: state-icon
          #       entity: light.living_room
          #       tap_action: {action: toggle}
          #       style: {top: 40%, left: 30%}
          #     - type: state-icon
          #       entity: light.bedroom
          #       tap_action: {action: toggle}
          #       style: {top: 30%, left: 70%}
          #     - type: state-icon
          #       entity: vacuum.juno
          #       style: {top: 65%, left: 50%}

  - title: System
    path: system
    icon: mdi:laptop
    theme: Jarvis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Hub (X1)
            icon: mdi:laptop
          - type: tile
            entity: sensor.processor_use
            name: CPU
            icon: mdi:chip
            color: cyan
          - type: tile
            entity: sensor.memory_use_percent
            name: Memory
            icon: mdi:memory
            color: cyan
          - type: tile
            entity: sensor.disk_use_percent
            name: Disk
            icon: mdi:harddisk
            color: cyan
      - type: grid
        cards:
          - type: heading
            heading: Hub load (24h)
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            entities:
              - sensor.processor_use
              - sensor.memory_use_percent
      - type: grid
        cards:
          - type: heading
            heading: Later
            icon: mdi:road-variant
          - type: markdown
            content: >
              Add your PCs here after Phase 17 (HASS.Agent / Wake-on-LAN):
              power buttons, CPU/GPU load, lock buttons.

              Smart plugs with power monitoring → uncomment `utility_meter` in
              configuration.yaml and add an energy-distribution card here.
              Car integrations (Ford/Tesla/Hyundai/etc.) add fuel/charge
              sensors that feed the morning briefing.
