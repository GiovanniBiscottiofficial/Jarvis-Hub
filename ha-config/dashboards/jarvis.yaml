  - title: Twin
    path: twin
    icon: mdi:home-analytics
    theme: Jarvis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: House state
            icon: mdi:home-analytics
          - type: tile
            entity: sensor.current_activity
            name: Activity
            icon: mdi:motion
            color: cyan
          - type: tile
            entity: input_boolean.quiet_mode
            name: Quiet mode
            color: cyan
          - type: tile
            entity: switch.x1_mute
            name: Microphone privacy
            icon: mdi:microphone-off
            color: amber
            tap_action:
              action: toggle
          - type: tile
            entity: input_boolean.sleep_mode
            name: Sleep mode
            color: cyan
          - type: tile
            entity: input_boolean.guest_mode
            name: Guest mode
            color: cyan
          - type: tile
            entity: input_boolean.vacation_mode
            name: Vacation
            color: cyan
