# Jarvis Command Center dashboard — dark glass hub look (theme: Jarvis)
# EDIT: rename placeholder entity IDs to match your devices
# (Settings -> Devices & Services -> Entities shows the real IDs).
title: Jarvis
views:
  # ------------------------------------------------------------------
  # Wall Panel — what the X1's own screen shows in kiosk mode
  # (bootstrap/setup-kiosk.sh points Chromium here).
  - title: Wall
    path: wall
    icon: mdi:tablet-dashboard
    theme: Jarvis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            text_only: true
            content: |
              <font size="7">**{{ now().strftime('%-I:%M %p') }}**</font>

              ### {{ now().strftime('%A, %B %-d') }}
          - type: markdown
            text_only: true
            content: >
              {% set hour = now().hour %}
              {% if hour < 12 %}
              <font color="#00e5ff">**Good morning, Giovanni.** Coffee?</font>
              {% elif hour < 18 %}
              <font color="#00e5ff">**Good afternoon, Giovanni.** At your service.</font>
              {% else %}
              <font color="#00e5ff">**Good evening, Giovanni.** Shall I prepare for movie night?</font>
              {% endif %}
          - type: markdown
            title: Briefing
            content: >
              {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
                 or 'LifeOS not reachable — is the lifeos container up?' }}
          - type: tile
            entity: input_boolean.sleep_mode
            name: Sleep
            icon: mdi:sleep
            color: indigo
            tap_action:
              action: toggle
          - type: tile
            entity: input_boolean.vacation_mode
            name: Vacation
            icon: mdi:beach
            color: teal
            tap_action:
              action: toggle
          - type: iframe
            url: /local/jarvis-avatar.html
            aspect_ratio: 75%
          - type: markdown
            title: Try saying…
            content: |
              • "Hey Jarvis, brief me"
              • "Hey Jarvis, movie night"
              • "Hey Jarvis, goodnight"
              • "Hey Jarvis, is the house ready for the night?"
              • "Hey Jarvis, log a glass of water"
              • "Hey Jarvis, add 50 to my vacation fund"
              • "Hey Jarvis, set a timer for 10 minutes"
              • "Hey Jarvis, add milk to the grocery list"
              • "Hey Jarvis, good morning" / "goodnight"
              • "Hey Jarvis, what's the weather like?"
              • "Hey Jarvis, what can you do?"

              **For fun:**
              • "Hey Jarvis, tell me a joke"
              • "Hey Jarvis, fun fact"
              • "Hey Jarvis, would you rather"
              • "Hey Jarvis, rock paper scissors — I pick rock"
              • "Hey Jarvis, I'm bored"
              • "Hey Jarvis, compliment me"
              • "Hey Jarvis, party time"
              • "Hey Jarvis, I am Iron Man"
              • "Hey Jarvis, flip a coin" / "roll the dice"

      - type: grid
        cards:
          - type: heading
            heading: Lights
            icon: mdi:lightbulb-group
          - type: iframe
            url: /local/jarvis-lights.html
            aspect_ratio: 120%
          - type: heading
            heading: Scenes
            icon: mdi:palette
          - type: tile
            entity: script.movie_night
            name: Movie Night
            icon: mdi:movie-open
            color: purple
            tap_action:
              action: call-service
              service: script.movie_night
          - type: tile
            entity: script.goodnight
            name: Goodnight
            icon: mdi:weather-night
            color: indigo
            tap_action:
              action: call-service
              service: script.goodnight
          - type: tile
            entity: script.leaving
            name: Leaving
            icon: mdi:exit-run
            color: red
            tap_action:
              action: call-service
              service: script.leaving
          - type: tile
            entity: input_boolean.guest_mode
            name: Guests
            icon: mdi:account-group
            color: green
            tap_action:
              action: toggle
          - type: markdown
            content: >-
              **Vacuum — not commissioned**

              Add a vacuum integration to unlock cleaning controls.

      - type: grid
        cards:
          - type: heading
            heading: Shopping
            icon: mdi:cart-outline
          - type: todo-list
            entity: todo.shopping_list
          - type: heading
            heading: Jarvis activity
            icon: mdi:robot
          # His recent actions at a glance. Full transcripts of what he
          # heard live in Settings -> Voice assistants -> Debug.
          - type: logbook
            hours_to_show: 12
            entities:
              - script.movie_night
              - script.goodnight
              - script.leaving
              - script.announce
              - input_boolean.guest_mode
              - input_boolean.sleep_mode
              - input_boolean.vacation_mode

      # Optional: full-screen "JARVIS initializing" splash overlay.
      # Needs the HACS "button-card" custom card (HACS -> Frontend ->
      # search "button-card" -> Download, then reload). Uncomment after
      # installing, and add an input_boolean called show_splash.
      # - type: conditional
      #   conditions:
      #     - entity: input_boolean.show_splash
      #       state: "on"
      #   card:
      #     type: custom:button-card
      #     styles:
      #       card:
      #         - position: fixed
      #         - top: "0"
      #         - left: "0"
      #         - width: 100vw
      #         - height: 100vh
      #         - z-index: "999"
      #         - background: radial-gradient(circle, #0a1628 0%, #000000 100%)
      #         - font-size: 2em
      #         - color: "#00e5ff"
      #     name: |
      #       [[[ return 'JARVIS — initializing systems…'; ]]]
      #     tap_action:
      #       action: call-service
      #       service: input_boolean.turn_off
      #       target:
      #         entity_id: input_boolean.show_splash

  # ------------------------------------------------------------------
  # Wall+ — the upgraded touch-first wall display. Needs three free HACS
  # frontend cards (HACS -> Frontend -> search -> Download -> reload):
  #   1. "Bubble Card"      2. "Mushroom"      3. "mini-graph-card"
  # Optional 4th: "card-mod" — unlocks the glow/shimmer styling below
  # (the card_mod: blocks are silently ignored until it's installed).
  # Until they're installed this tab shows red "custom element" boxes —
  # the classic Wall tab keeps working regardless. Once you like Wall+,
  # point the kiosk at it:
  #   KIOSK_URL="http://localhost:8123/local/jarvis-splash.html?next=/jarvis-hub/wall-plus" \
  #     bash bootstrap/setup-kiosk.sh
  - title: Wall+
    path: wall-plus
    icon: mdi:monitor-star
    theme: Jarvis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            text_only: true
            content: |
              <font size="7">**{{ now().strftime('%-I:%M %p') }}**</font>

              ### {{ now().strftime('%A, %B %-d') }}
            card_mod:
              style: |
                ha-card {
                  background: none !important;
                  border: none !important;
                  box-shadow: none !important;
                  overflow: visible !important;
                }
                ha-card::after { display: none; }
                ha-markdown {
                  font-family: 'Orbitron', sans-serif;
                  letter-spacing: 0.06em;
                  animation: jarvis-glow 3.5s ease-in-out infinite;
                }
                ha-markdown-element > font {
                  font-size: 3.8rem;
                  line-height: 1.05;
                  background: linear-gradient(180deg, #eafcff 20%, #00e5ff 90%);
                  -webkit-background-clip: text;
                  background-clip: text;
                  -webkit-text-fill-color: transparent;
                }
                ha-markdown-element h3 {
                  color: #7fd8e8;
                  font-weight: 600;
                  letter-spacing: 0.35em;
                  text-transform: uppercase;
                  font-size: 0.95rem;
                  margin-top: 2px;
                }
                @keyframes jarvis-glow {
                  0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.35)); }
                  50% { filter: drop-shadow(0 0 26px rgba(0, 229, 255, 0.75)); }
                }
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:home-heart
                icon_color: cyan
                content: >-
                  {{ states('sensor.room_atmosphere') | replace('_', ' ') | title }}
              - type: template
                icon: mdi:briefcase-clock
                icon_color: >-
                  {{ 'amber' if is_state('binary_sensor.giovanni_work_hours', 'on') else 'cyan' }}
                content: >-
                  {{ 'At work' if is_state('binary_sensor.giovanni_work_hours', 'on') else 'Off the clock' }}
              - type: entity
                entity: sensor.x1_battery
                icon_color: green
              - type: entity
                entity: sensor.x1_cpu_temperature
                icon_color: orange
              - type: entity
                entity: sensor.system_monitor_disk_usage
                icon: mdi:harddisk
                icon_color: blue
              - type: template
                icon: mdi:sleep
                icon_color: >-
                  {{ 'indigo' if is_state('input_boolean.sleep_mode', 'on') else 'disabled' }}
                content: >-
                  {{ 'Sleep' if is_state('input_boolean.sleep_mode', 'on') else '' }}
                tap_action:
                  action: call-service
                  service: input_boolean.toggle
                  target:
                    entity_id: input_boolean.sleep_mode
          - type: iframe
            url: /local/jarvis-avatar.html
            aspect_ratio: 70%
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  border: none;
                  box-shadow: none;
                }
          - type: markdown
            title: Briefing
            content: >
              {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
                 or 'LifeOS not reachable — is the lifeos container up?' }}
            card_mod:
              style: |
                ha-card {
                  position: relative;
                  overflow: hidden;
                }
                ha-card::before {
                  content: '';
                  position: absolute;
                  top: 0; left: 0; right: 0; height: 1px;
                  background: linear-gradient(90deg,
                    transparent, rgba(0, 212, 255, 0.5), transparent);
                }

      - type: grid
        cards:
          - type: iframe
            url: /local/jarvis-rooms.html
            aspect_ratio: 125%
            card_mod:
              style: |
                ha-card {
                  background: #030910;
                  border: 1px solid rgba(67, 217, 238, 0.22);
                  box-shadow: none;
                }
          - type: heading
            heading: Scenes
            icon: mdi:palette
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: Movie Night
            icon: mdi:movie-open
            tap_action:
              action: call-service
              service: script.movie_night
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: Goodnight
            icon: mdi:weather-night
            tap_action:
              action: call-service
              service: script.goodnight
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: Leaving
            icon: mdi:exit-run
            tap_action:
              action: call-service
              service: script.leaving
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            card_layout: large
            entity: input_boolean.guest_mode
            name: Guests
            icon: mdi:account-group
          - type: markdown
            content: >-
              **Vacuum — not commissioned**

              Cleaning actions stay disabled until hardware is available.
          - type: heading
            heading: Jarvis OS
            icon: mdi:apps
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: LifeOS
            icon: mdi:heart-pulse
            tap_action:
              action: navigate
              navigation_path: /lifeos-app/app
            button_action:
              tap_action:
                action: navigate
                navigation_path: /lifeos-app/app
          - type: custom:bubble-card
            card_type: button
            button_type: state
            card_layout: large
            entity: sensor.lifeos_safe_to_spend
            name: Safe to Spend
            icon: mdi:cash-check
            sub_button:
              - entity: sensor.lifeos_safe_to_spend
                name: Audit
                attribute: audit
                show_attribute: true
                show_state: false
            tap_action:
              action: navigate
              navigation_path: /lifeos-app/app
            button_action:
              tap_action:
                action: navigate
                navigation_path: /lifeos-app/app
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: Apps & Media
            icon: mdi:television-play
            tap_action:
              action: navigate
              navigation_path: /jarvis-hub/media
            button_action:
              tap_action:
                action: navigate
                navigation_path: /jarvis-hub/media
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: System
            icon: mdi:chip
            tap_action:
              action: navigate
              navigation_path: /jarvis-hub/system
            button_action:
              tap_action:
                action: navigate
                navigation_path: /jarvis-hub/system
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            name: Ambient mode
            icon: mdi:weather-night
            tap_action:
              action: url
              url_path: /local/jarvis-idle.html
            button_action:
              tap_action:
                action: url
                url_path: /local/jarvis-idle.html

      - type: grid
        cards:
          - type: heading
            heading: Hub vitals
            icon: mdi:pulse
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.system_monitor_processor_use
                name: CPU %
                color: "#00e5ff"
              - entity: sensor.system_monitor_memory_usage
                name: RAM %
                color: "#c084fc"
            hours_to_show: 2
            points_per_hour: 30
            line_width: 2
            animate: true
            lower_bound: 0
            upper_bound: 100
            show:
              state: true
              legend: true
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.x1_cpu_temperature
                name: CPU °C
            hours_to_show: 12
            points_per_hour: 4
            line_color: "#00e5ff"
            line_width: 3
            animate: true
            show:
              fill: fade
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.x1_battery
                name: Battery %
            hours_to_show: 24
            points_per_hour: 2
            line_color: "#4ade80"
            line_width: 3
            animate: true
            lower_bound: 0
            upper_bound: 100
            show:
              fill: fade
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.system_monitor_thinkpad_fan_speed
                name: Fan RPM
            hours_to_show: 6
            points_per_hour: 12
            line_color: "#f59e0b"
            line_width: 2
            animate: true
            show:
              fill: fade
          - type: heading
            heading: Shopping
            icon: mdi:cart-outline
          - type: todo-list
            entity: todo.shopping_list
          - type: heading
            heading: Errands
            icon: mdi:run-fast
          - type: todo-list
            entity: todo.errands

  # ------------------------------------------------------------------
  - title: Home
    path: home
    icon: mdi:home-assistant
    theme: Jarvis
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Who's home
            icon: mdi:account-check
          - type: tile
            entity: person.giovanni_biscotti
          - type: heading
            heading: Briefing
            icon: mdi:weather-sunset-up
          - type: markdown
            content: >
              {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
                 or 'LifeOS not reachable — is the lifeos container up?' }}

              LifeOS lives at `http://<hub-ip>:8090` — add it to your
              phone's home screen.
          - type: heading
            heading: Calendar
            icon: mdi:calendar
          - type: calendar
            initial_view: listWeek
            entities:
              - calendar.jarvis_calendar
          - type: heading
            heading: Today
            icon: mdi:earth
          - type: tile
            entity: sensor.season
            icon: mdi:sprout
          - type: tile
            entity: sensor.moon_phase
          - type: tile
            entity: binary_sensor.workday_sensor_us
            name: Workday

      - type: grid
        cards:
          - type: heading
            heading: Lights
            icon: mdi:lightbulb-group
          - type: markdown
            content: >-
              Use **Wall → Sanctuary Command Center** for Area-aware room
              lighting, calibration, and device health.

      - type: grid
        cards:
          - type: heading
            heading: Quick actions
            icon: mdi:gesture-tap-button
          - type: tile
            entity: script.movie_night
            name: Movie Night
            icon: mdi:movie-open
            color: purple
            tap_action:
              action: call-service
              service: script.movie_night
          - type: tile
            entity: script.goodnight
            name: Goodnight
            icon: mdi:weather-night
            color: indigo
            tap_action:
              action: call-service
              service: script.goodnight
          - type: tile
            entity: script.leaving
            name: Leaving
            icon: mdi:exit-run
            color: red
            tap_action:
              action: call-service
              service: script.leaving
          - type: tile
            entity: input_boolean.guest_mode
            name: Guest mode
            icon: mdi:account-group
            color: green
            tap_action:
              action: toggle
          - type: tile
            entity: input_boolean.vacation_mode
            name: Vacation
            icon: mdi:beach
            color: teal
            tap_action:
              action: toggle

  # ------------------------------------------------------------------
  - title: Vacuum
    path: vacuum
    icon: mdi:robot-vacuum
    theme: Jarvis
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Readiness
            icon: mdi:robot-vacuum
          - type: markdown
            content: >-
              ## Vacuum not commissioned
              Jarvis will not issue vacuum service calls until Home Assistant
              reports an available vacuum entity.
      - type: grid
        cards:
          - type: heading
            heading: Cleaning history
            icon: mdi:history
          - type: markdown
            content: "Cleaning history will appear after commissioning."

