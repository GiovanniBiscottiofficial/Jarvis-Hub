            hide_state: true
            tap_action: { action: url, url_path: "https://tubitv.com" }
          - type: tile
            entity: sun.sun
            name: Pluto TV
            icon: mdi:television-guide
            color: amber
            hide_state: true
            tap_action: { action: url, url_path: "https://pluto.tv" }
          - type: tile
            entity: sun.sun
            name: LifeOS
            icon: mdi:heart-pulse
            color: cyan
            hide_state: true
            tap_action:
              action: navigate
              navigation_path: /lifeos-app/app
          - type: markdown
            content: >-
              {% set players = states.media_player
                 | rejectattr('state', 'in', ['unknown', 'unavailable']) | list %}
              ## Jarvis media readiness
              **{{ players | count }} player{{ 's' if players | count != 1 else '' }} ready**

              Sanctuary mode: **{{ states('input_select.sanctuary_mode') }}**

              Every app above remains directly available on the X1. The
              full-screen command view adds player routing when Home Assistant
              exposes that capability.

  - title: Media Command
    path: media-command
    icon: mdi:monitor-dashboard
    theme: Jarvis
    subview: true
    type: panel
    cards:
      - type: iframe
        url: /local/jarvis-media.html
        aspect_ratio: 72%
        card_mod:
          style: |
            ha-card {
              width: 100%;
              min-height: calc(100vh - 8px);
              background: #02070d;
              border: 0;
              box-shadow: none;
            }

  # ------------------------------------------------------------------
  - title: To-do
    path: todo
    icon: mdi:clipboard-check-outline
    theme: Jarvis
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Home Assistant list
            icon: mdi:format-list-checks
          - type: markdown
            content: >
              Voice and manually added Home Assistant tasks live here. This is
              separate from the routed Jarvis list.
          - type: todo-list
            entity: todo.shopping_list
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Jarvis routed shopping
            icon: mdi:cart-arrow-right
          - type: iframe
            url: /local/lifeos.html?tab=todo&v=20260826-1
            grid_options:
              columns: full
              rows: 8
      - type: grid
        cards:
          - type: heading
            heading: Grocy inventory
            icon: mdi:fridge-outline
          - type: markdown
            content: >
              Grocy tracks inventory and expiry dates. It is separate from both
              Home Assistant tasks and the Jarvis routed shopping database.
          - type: button
            name: Open Grocy
            icon: mdi:open-in-new
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /local/open.html?port=9283&path=/
            hold_action:
              action: none

