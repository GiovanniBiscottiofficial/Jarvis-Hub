# Jarvis Command Center dashboard
# Loaded via configuration.yaml (lovelace -> dashboards).
# EDIT: rename placeholder entity IDs to match your devices
# (Settings -> Devices & Services -> Entities shows the real IDs).
title: Jarvis
views:
  # ------------------------------------------------------------------
  - title: Home
    path: home
    icon: mdi:home-assistant
    cards:
      - type: markdown
        content: >
          ## Jarvis Command Center
          {{ now().strftime('%A, %B %d — %H:%M') }}

      - type: entities
        title: Who's home
        entities:
          - entity: person.keona
        footer:
          type: graph
          entity: zone.home
          hours_to_show: 24

      - type: light
        entity: light.living_room
        name: Living Room

      - type: light
        entity: light.bedroom
        name: Bedroom

      - type: horizontal-stack
        cards:
          - type: button
            name: Movie Night
            icon: mdi:movie-open
            tap_action:
              action: call-service
              service: script.movie_night
          - type: button
            name: Goodnight
            icon: mdi:weather-night
            tap_action:
              action: call-service
              service: script.goodnight

      - type: horizontal-stack
        cards:
          - type: button
            name: Leaving
            icon: mdi:exit-run
            tap_action:
              action: call-service
              service: script.leaving
          - type: button
            entity: input_boolean.guest_mode
            name: Guest mode
            icon: mdi:account-group
            tap_action:
              action: toggle

      - type: markdown
        title: LifeOS briefing
        content: >
          {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
             or 'LifeOS not reachable — is the lifeos container up?' }}

          [Open LifeOS](http://YOUR-LAPTOP-IP:8090)

  # ------------------------------------------------------------------
  # Wall Panel — what the X1's own screen shows in kiosk mode
  # (bootstrap/setup-kiosk.sh points Chromium here).
  - title: Wall
    path: wall
    icon: mdi:tablet-dashboard
    subview: false
    cards:
      - type: markdown
        content: |
          # {{ now().strftime('%H:%M') }}
          ## {{ now().strftime('%A, %B %d') }}

      - type: markdown
        title: Briefing
        content: >
          {{ state_attr('sensor.lifeos_morning_briefing', 'speech')
             or 'LifeOS not reachable — is the lifeos container up?' }}

      - type: horizontal-stack
        cards:
          - type: light
            entity: light.living_room
            name: Living Room
          - type: light
            entity: light.bedroom
            name: Bedroom

      - type: horizontal-stack
        cards:
          - type: button
            name: Movie Night
            icon: mdi:movie-open
            tap_action:
              action: call-service
              service: script.movie_night
          - type: button
            name: Goodnight
            icon: mdi:weather-night
            tap_action:
              action: call-service
              service: script.goodnight
          - type: button
            name: Leaving
            icon: mdi:exit-run
            tap_action:
              action: call-service
              service: script.leaving

      - type: horizontal-stack
        cards:
          - type: button
            name: Clean
            icon: mdi:robot-vacuum
            tap_action:
              action: call-service
              service: vacuum.start
              target:
                entity_id: vacuum.juno
          - type: button
            name: Dock
            icon: mdi:home-import-outline
            tap_action:
              action: call-service
              service: vacuum.return_to_base
              target:
                entity_id: vacuum.juno

      - type: todo-list
        entity: todo.shopping_list
        title: Shopping list

  # ------------------------------------------------------------------
  - title: Vacuum
    path: vacuum
    icon: mdi:robot-vacuum
    cards:
      - type: entities
        title: Juno
        entities:
          - entity: vacuum.juno
      - type: horizontal-stack
        cards:
          - type: button
            name: Clean
            icon: mdi:play
            tap_action:
              action: call-service
              service: vacuum.start
              target:
                entity_id: vacuum.juno
          - type: button
            name: Dock
            icon: mdi:home-import-outline
            tap_action:
              action: call-service
              service: vacuum.return_to_base
              target:
                entity_id: vacuum.juno
          - type: button
            name: Locate
            icon: mdi:map-marker-question
            tap_action:
              action: call-service
              service: vacuum.locate
              target:
                entity_id: vacuum.juno
      - type: history-graph
        title: Cleaning history
        hours_to_show: 168
        entities:
          - vacuum.juno

  # ------------------------------------------------------------------
  - title: Media
    path: media
    icon: mdi:television
    cards:
      - type: media-control
        entity: media_player.fire_tv
      - type: entities
        title: Quick launch (Fire TV)
        entities:
          - entity: script.movie_night
            name: "Movie Night (Netflix + dim lights)"

  # ------------------------------------------------------------------
  - title: Kitchen
    path: kitchen
    icon: mdi:fridge
    cards:
      - type: todo-list
        entity: todo.shopping_list
        title: Shopping list
      - type: markdown
        content: >
          **Grocy** (full inventory + expiry tracking) lives at
          [http://YOUR-LAPTOP-IP:9283](http://YOUR-LAPTOP-IP:9283)
          once you run `docker compose --profile grocy up -d`.

  # ------------------------------------------------------------------
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    cards:
      - type: markdown
        content: >
          **No cameras yet.** When you get one: put its RTSP URL in
          `frigate/config.yml`, run `docker compose --profile cameras up -d`,
          install the **Frigate** integration via HACS, then replace this
          card with `picture-glance` cards for each camera. You'll be able
          to check them from work through Tailscale + the Companion app.
      # - type: picture-glance
      #   title: Front door
      #   camera_image: camera.front_door
      #   camera_view: live
      #   entities:
      #     - binary_sensor.front_door_person_occupancy

  # ------------------------------------------------------------------
  - title: System
    path: system
    icon: mdi:laptop
    cards:
      - type: entities
        title: Hub (X1)
        entities:
          - entity: sensor.processor_use
            name: CPU
          - entity: sensor.memory_use_percent
            name: Memory
          - entity: sensor.disk_use_percent
            name: Disk
      - type: history-graph
        title: Hub load (24h)
        hours_to_show: 24
        entities:
          - sensor.processor_use
          - sensor.memory_use_percent
      - type: markdown
        content: >
          Add your PCs here after Phase 17 (HASS.Agent / Wake-on-LAN):
          power buttons, CPU/GPU load, lock buttons.
      - type: markdown
        title: Energy & car (later)
        content: >
          Smart plugs with power monitoring → uncomment `utility_meter` in
          configuration.yaml and add an energy-distribution card here.
          Car integrations (Ford/Tesla/Hyundai/etc.) add fuel/charge sensors
          that feed the morning briefing.
