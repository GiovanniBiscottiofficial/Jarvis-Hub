# Jarvis — dark, glassy hub-display theme
# Applied per-view in dashboards/jarvis.yaml; set it globally from your
# profile (click your name, bottom-left → Theme → Jarvis).
Jarvis:
  # palette
  primary-color: "#00e5ff"
  accent-color: "#00b8d4"
  light-primary-color: "#4dd0e1"
  dark-primary-color: "#00838f"
  state-icon-color: "#00e5ff"
  state-icon-active-color: "#00e5ff"

  # backgrounds
  primary-background-color: "#070b14"
  secondary-background-color: "#0c1220"
  lovelace-background: >-
    repeating-linear-gradient(0deg, rgba(0, 229, 255, 0.035) 0px, rgba(0, 229, 255, 0.035) 1px, transparent 1px, transparent 56px),
    repeating-linear-gradient(90deg, rgba(0, 229, 255, 0.035) 0px, rgba(0, 229, 255, 0.035) 1px, transparent 1px, transparent 56px),
    radial-gradient(ellipse 60% 45% at 18% 0%, rgba(0, 120, 190, 0.20) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 8%, rgba(0, 229, 255, 0.08) 0%, transparent 55%),
    radial-gradient(ellipse 70% 55% at 50% 110%, rgba(8, 30, 60, 0.55) 0%, transparent 65%),
    linear-gradient(180deg, #04070f 0%, #02040a 100%)
  markdown-code-background-color: "#0c1220"

  # cards — floating glass panels
  card-background-color: "#060d18d9"
  ha-card-background: "#060d18d9"
  ha-card-border-radius: "4px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(0, 229, 255, 0.22)"
  ha-card-box-shadow: "0 10px 30px rgba(0, 0, 0, 0.6), 0 0 24px rgba(0, 212, 255, 0.10), inset 0 0 30px rgba(0, 212, 255, 0.04)"

  # HUD pass (card-mod theme): thin corner brackets + top scan line on every panel
  card-mod-theme: Jarvis
  card-mod-card: |
    ha-card {
      position: relative;
    }
    ha-card::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      --jb: rgba(0, 229, 255, 0.85);
      background:
        linear-gradient(var(--jb), var(--jb)) left 0 top 0 / 16px 2px,
        linear-gradient(var(--jb), var(--jb)) left 0 top 0 / 2px 16px,
        linear-gradient(var(--jb), var(--jb)) right 0 top 0 / 16px 2px,
        linear-gradient(var(--jb), var(--jb)) right 0 top 0 / 2px 16px,
        linear-gradient(var(--jb), var(--jb)) left 0 bottom 0 / 16px 2px,
        linear-gradient(var(--jb), var(--jb)) left 0 bottom 0 / 2px 16px,
        linear-gradient(var(--jb), var(--jb)) right 0 bottom 0 / 16px 2px,
        linear-gradient(var(--jb), var(--jb)) right 0 bottom 0 / 2px 16px;
      background-repeat: no-repeat;
    }

  # Bubble Card (HACS) — picked up automatically once the card is installed
  bubble-main-background-color: "rgba(6, 13, 24, 0.85)"
  bubble-secondary-background-color: "rgba(0, 212, 255, 0.12)"
  bubble-accent-color: "#00e5ff"
  bubble-icon-background-color: "rgba(0, 212, 255, 0.10)"
  bubble-border-radius: "6px"

  # Mushroom (HACS)
  mush-rgb-state-entity: "0, 229, 255"
  mush-chip-background: "rgba(6, 13, 24, 0.85)"
  mush-chip-border-radius: "4px"

  # text
  primary-text-color: "#e8eef7"
  secondary-text-color: "#93a4bc"
  text-primary-color: "#04121a"
  disabled-text-color: "#4a5872"
  primary-font-family: "'Rajdhani', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif"
  paper-font-common-base_-_font-family: "'Rajdhani', sans-serif"
  paper-font-body1_-_font-family: "'Rajdhani', sans-serif"
  paper-font-headline_-_font-family: "'Orbitron', 'Rajdhani', sans-serif"
  paper-font-title_-_font-family: "'Orbitron', 'Rajdhani', sans-serif"
  mdc-typography-font-family: "'Rajdhani', sans-serif"
  ha-font-family-body: "'Rajdhani', 'Segoe UI', Roboto, sans-serif"
  ha-font-family-heading: "'Orbitron', 'Rajdhani', sans-serif"
  ha-font-smoothing: antialiased

  # header + sidebar
  app-header-background-color: "#070b14"
  app-header-text-color: "#e8eef7"
  app-header-selection-bar-color: "#00e5ff"
  sidebar-background-color: "#0a0f1c"
  sidebar-text-color: "#93a4bc"
  sidebar-selected-text-color: "#00e5ff"
  sidebar-selected-icon-color: "#00e5ff"
  sidebar-icon-color: "#5b6b85"
  divider-color: "#1d2a42"

  # controls
  switch-checked-color: "#00e5ff"
  switch-checked-button-color: "#00e5ff"
  switch-checked-track-color: "#00838f"
  slider-color: "#00e5ff"
  slider-track-color: "#1d2a42"
  paper-item-icon-active-color: "#00e5ff"
  mdc-theme-primary: "#00e5ff"
  label-badge-red: "#ff5c7a"

  # tile / state colors
  state-active-color: "#00e5ff"
  state-light-active-color: "#ffd166"
  state-switch-active-color: "#00e5ff"

  # inputs
  input-fill-color: "#0c1220"
  input-ink-color: "#e8eef7"
  input-label-ink-color: "#93a4bc"
  input-idle-line-color: "#1d2a42"
  input-hover-line-color: "#00b8d4"
  input-focused-label-ink-color: "#00e5ff"
