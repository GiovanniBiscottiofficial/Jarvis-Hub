# Frigate starter config — fill in your camera(s) when you get them,
# then: docker compose --profile cameras up -d
# Docs: https://docs.frigate.video/configuration/

mqtt:
  enabled: false

# Intel QuickSync hardware video decoding — the X1's UHD 620 decodes camera
# streams so the CPU doesn't have to (the compose file already passes
# /dev/dri through to the container).
ffmpeg:
  hwaccel_args: preset-vaapi

# Uncomment and edit when you have a camera. Most WiFi cams expose an
# RTSP URL (check the camera app or ispyconnect.com for your model).
# The X1's own webcam works today: run bootstrap/setup-satellite.sh,
# then uncomment the x1_webcam block below.
# cameras:
#   x1_webcam:
#     ffmpeg:
#       inputs:
#         - path: rtsp://127.0.0.1:8556/x1_webcam
#           roles: [detect, record]
#     detect:
#       width: 1280
#       height: 720
#     record:
#       enabled: true
#       retain:
#         days: 3
#     objects:
#       track: [person]
#   front_door:
#     ffmpeg:
#       inputs:
#         - path: rtsp://USER:PASSWORD@192.168.1.xxx:554/stream1
#           roles: [detect, record]
#     detect:
#       width: 1280
#       height: 720
#     record:
#       enabled: true
#       retain:
#         days: 3
#     objects:
#       track: [person, car, dog, cat, package]

# Then in Home Assistant: HACS → Frigate integration → cameras, person
# alerts, and doorbell-style snapshots appear automatically, and the
# Cameras tab on the Jarvis dashboard lights up (remotely too, via
# Tailscale + the Companion app).
